<script type="importmap">{"integrity":{"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs":"sha384-v3GXk0Hasw+L0V/A+IZbJSuL8ib7zdTjbdUDM8EkikjcUne7z2LSPh8RNuxiZUU2"}}</script>
<script>
/* ============================================================
   CAM BUREAU — calque « filtres visage » pour OBS
   Les 9 filtres de la cam tel (code repris tel quel de camtel.html).

   La vraie source caméra (ZV-1F → HD60 S, source « WEB CAM ») reste intacte.
   Cette page est une SOURCE NAVIGATEUR (« Filtres cam ») posée juste au-dessus :
   - au repos : transparente, caméra fermée, rien ne calcule ;
   - pendant un filtre : lit « OBS Virtual Camera » (Type de sortie : Source → WEB CAM),
     applique le filtre et l'affiche par-dessus la cam.
   Sécurités : visage pas vu, plus d'image, image pas en 16:9, erreur → le calque
   s'efface et la cam normale reste à l'antenne.

   Source navigateur : 1920×1080, FPS personnalisé 30 (= VIDEO_FPS), autorisations par défaut.
   https://suunbear.github.io/suunbear-cam/cambureau.html#chat=TA_SESSION
   Options à ajouter après le # :
     &stats        = panneau de mesures (VISIBLE À L'ANTENNE : tests hors live)
     &test=zinzin  = lance ce filtre 5 s après le chargement (Actualiser la source = relancer)
     &dur=30       = durée du filtre en secondes
     &fps=30 · &det=30 · &scale=0.667 = réglages de charge sans renvoyer le fichier
     &cote=3 · &taille=1 · &detour=1 = Paatrice (« derriere ») : écart, taille, détourage, sans renvoyer le fichier
     &brut         = diagnostic (image telle qu'elle arrive, SÉCURITÉS COUPÉES : jamais en live)

   SAMMI, un bouton par filtre :
     1. démarrer la caméra virtuelle · 2. attendre 1500 ms ·
     3. HTTP Request GET https://io.socialstream.ninja/<SESSION>/content/null/{"event":"filtre_bureau","meta":{"nom":"zinzin"}}
     4. attendre 95000 ms · 5. arrêter la caméra virtuelle
   noms : content · derriere · mini · zinzin · pleure · kawai · chad · exagere · colere (sans accents)
          (anciennes versions : content1 · chad1)
   La cam tel écoute "filtre", la cam bureau "filtre_bureau" : chacune ignore l'autre.

   OBS doit être lancé avec l'option --enable-media-stream.
   ============================================================ */
const CONFIG = {
  VCAM_AUTO        : false, // false = SAMMI allume la caméra virtuelle avant le filtre et l'éteint après.
                            // true  = la page le fait elle-même (source navigateur : « Accès complet à OBS »)
  VCAM_WARMUP      : 0.4,   // (VCAM_AUTO) s d'attente après l'allumage, avant de lire l'image
  VCAM_STOP_DELAY  : 10,    // (VCAM_AUTO) s après le dernier filtre avant d'éteindre
  CAM_LABEL        : 'OBS Virtual Camera',  // nom de la caméra lue (la sortie « Source » d'OBS)
  WIDTH            : 1920,
  HEIGHT           : 1080,
  VIDEO_FPS        : 30,    // images/s du calque (mesuré : 30 = ~+14 pts GPU, 60 = ~+30). Source navigateur au même FPS
  DETECT_FPS       : 30,    // suivis du visage par seconde. À 30 i/s : 30, 15 ou 10 seulement (15 = le filtre traîne)
  RENDER_SCALE     : 1,     // taille de calcul : 1 = 1080p · 0.667 = 720p (mesuré : ne fait gagner que ~3 pts GPU)
  PREDICT          : true,  // prédiction du mouvement entre deux suivis (utile seulement si VIDEO_FPS > DETECT_FPS)
  SMOOTH           : 0.55,  // lissage du suivi (comme la cam tel)
  FACE_HOLD        : 1.5,   // s sans visage avant que le calque s'efface (la cam normale revient)

  FILTERS          : true,
  FILTER_DURATION  : 90,    // secondes par filtre (1 min 30)
  FILTER_STRENGTH  : 1,     // intensité de TOUS les filtres : 0.5 = discret · 1 = normal · 1.5 = très caricatural
  FILTER_LEVELS    : { content:1, derriere:1, mini:1, zinzin:1, pleure:1, chat:1, chad:1, exagere:1, fache:1 },   // filtre par filtre (chat = Kawai, fache = Colère)
  FILTER_FADE      : 0.5,   // montée / descente de la déformation (s)
  OVERLAY_FADE     : 0.15,  // apparition / disparition du calque (s)
  PAAT_BRAS        : "tatoue",   // Paatrice (« derrière toi ») : "tatoue" · "muscle" · "poilu" · "nouille" · "simple"
  PAAT_POILS       : 2,     // poils sur son torse : 1 = poilu · 2 = très poilu
  PAAT_COTE        : 3,     // écart de Paatrice sur le côté, en « largeurs d'yeux » (cam tel : 1.3 = très caché derrière toi)
  PAAT_DETOURAGE   : false, // false = pas de détourage (~5 pts GPU en moins) : il est À CÔTÉ de toi, pas derrière
  PAAT_HOLD        : 8,     // s pendant lesquels il reste à l'écran si le suivi te perd (de profil)
  PAAT_TAILLE      : 1,     // taille de Paatrice (1 = comme la cam tel · 1.2 = plus grand)
  FILTER_QUEUE_MAX : 10,
  FILTER_PRELOAD   : true   // moteur prêt au chargement → 1er filtre immédiat (au repos : aucun calcul)
};
</script>

<script>
(() => {
  const C = CONFIG;
  const frag  = new URLSearchParams(location.hash.slice(1)), query = new URLSearchParams(location.search);
  const has   = k => frag.has(k) || query.has(k);
  const get   = k => (frag.get(k) || query.get(k) || '').trim();
  const SESSION = get('chat');
  const RAW = has('brut');                          // diagnostic : image affichée telle qu'elle arrive (proportions réelles)
  if (+get('dur') > 0)   C.FILTER_DURATION = +get('dur');
  if (+get('fps') > 0)   C.VIDEO_FPS    = +get('fps');                   // tests sans renvoyer le fichier : &fps=30
  if (+get('det') > 0)   C.DETECT_FPS   = +get('det');                   // &det=30
  if (+get('scale') > 0) C.RENDER_SCALE = Math.min(1, +get('scale'));    // &scale=0.667 (calque calculé en 720p)
  if (+get('cote') > 0)  C.PAAT_COTE    = +get('cote');                  // Paatrice : &cote=2.2 (plus sur le côté)
  if (+get('taille') > 0) C.PAAT_TAILLE = +get('taille');                // Paatrice : &taille=1.2 (plus grand)
  if (has('detour'))     C.PAAT_DETOURAGE = get('detour') !== '0';       // Paatrice : &detour=1 (derrière toi, détouré)

  const $ = s => document.querySelector(s);
  const cv = $('#fx'), vid = $('#src'), hud = $('#hud'), md = navigator.mediaDevices;
  cv.style.transition = 'opacity ' + C.OVERLAY_FADE + 's linear';
  if (RAW) { cv.style.objectFit = 'contain'; cv.style.background = '#5a0a3c'; }   // bandes violettes = zones vides de l'image reçue
  const log = (...a) => console.log('[cambureau]', ...a);
  const ST = { frames:0, dets:0, detMs:0, detMax:0, fps:0, dps:0, avg:0, max:0, cam:'', err:'', ws:false, vcam:null };

  /* ============================================================
     Filtres : définitions, moteur, déformation et dessins repris
     TELS QUELS de camtel.html (validés en live le 30/09/2026).
     ============================================================ */
  const MP_BASE  = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1';   // version figée (empreinte dans l'importmap)
  const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

  /* Déformations : [point du visage, vers le bas, vers le centre, rayon]
     En fractions de l'écart entre les yeux : ça suit la distance au tel.
     « vers le bas » négatif = vers le haut. Indices = carte MediaPipe Face Mesh. */
  const fumeOn = el => el > 1.4 && (el - 1.4) % 3 < .9;   // Fâché : jets de vapeur (et tremblement) toutes les 3 s
  const EYE_R = [33, 133, 159, 145], EYE_L = [263, 362, 386, 374];   // centres des yeux
  const MOUTH = [61, 291, 13, 14], NOSE = [1, 98, 327];
  const FX = {
    content: { name:'😁 Abusément content', stk:'content', bulge:[   // + paillettes dans les yeux
      [EYE_R, .52, .47, .68], [EYE_L, .52, .47, .68]    // yeux globuleux
    ], pts:[
      [61, -.20, -.10, .30], [291, -.20, -.10, .30],    // sourire jusqu'aux oreilles : coins très haut et large
      [40, -.06,   0, .13], [270, -.06,   0, .13],      // lèvre du haut : les côtés remontent
      [91, -.08,   0, .13], [321, -.08,   0, .13],      // lèvre du bas : bouche en U
      [17,  .03,   0, .12],                             // bas du U
      [50, -.07,   0, .18], [280, -.07,   0, .18]       // pommettes remontées
    ]},
    content1: { name:'😁 Abusément content', bulge:[   // ancienne version sans paillettes (nom SAMMI « content1 »)
      [EYE_R, .52, .47, .68], [EYE_L, .52, .47, .68]    // yeux globuleux
    ], pts:[
      [61, -.20, -.10, .30], [291, -.20, -.10, .30],    // sourire jusqu'aux oreilles : coins très haut et large
      [40, -.06,   0, .13], [270, -.06,   0, .13],      // lèvre du haut : les côtés remontent
      [91, -.08,   0, .13], [321, -.08,   0, .13],      // lèvre du bas : bouche en U
      [17,  .03,   0, .12],                             // bas du U
      [50, -.07,   0, .18], [280, -.07,   0, .18]       // pommettes remontées
    ]},

    /* --- Façon Snapchat / TikTok : loupes [points (centre = moyenne), largeur, hauteur, force]
       force > 0 = grossit (0.75 ≈ ×4 au centre) · force < 0 = rapetisse --- */
    derriere: { name:'👀 Derrière toi', stk:'derriere', seg:true },   // Paatrice surgit derrière toi (détourage)
    mini: { name:'🤏 Mini', bulge:[                     // l'inverse de Zinzin
      [EYE_R, .48, .38, -.86], [EYE_L, .48, .38, -.86], // yeux tout petits
      [MOUTH, .80, .42, -.86]                           // bouche toute petite
    ]},
    zinzin: { name:'🤪 Zinzin', bulge:[
      [EYE_R, .55, .50, .72], [EYE_L, .55, .50, .72],   // gros yeux…
      [MOUTH, .92, .55, .70],                           // … et grande bouche
      [NOSE,  .28, .24, -.30]
    ]},
    pleure: { name:'😢 Pleure', stk:'pleure', pts:[      // gros chagrin + larmes
      [107, -.13, .05, .19], [336, -.13, .05, .19],     // sourcils intérieurs relevés et froncés
      [55,  -.07, .04, .11], [285, -.07, .04, .11],
      [70,   .06,   0, .16], [300,  .06,   0, .16],     // bouts des sourcils qui tombent
      [159,  .04,   0, .08], [386,  .04,   0, .08],     // paupières lourdes
      [33,   .04,   0, .12], [263,  .04,   0, .12],     // yeux tombants
      [61,   .13,   0, .15], [291,  .13,   0, .15],     // bouche en arc triste : les coins tombent…
      [40,   .035,  0, .09], [270,  .035,  0, .09],     // … et toute la lèvre suit la courbe (épaisseur naturelle)
      [91,   .045,  0, .09], [321,  .045,  0, .09],
      [17,  -.03,   0, .10],                            // lèvre du bas qui boude un peu
      [152, -.04,   0, .20]                             // menton qui se plisse
    ], anim:el => {                                     // la lèvre du bas tremble par moments (sanglots)
      const q = .014 * Math.max(0, Math.sin(el * 1.6)) * Math.sin(el * 44);
      return [[17, q, 0, .09], [14, q * .7, 0, .07]];
    }},
    chad: { name:'🗿 Chad', pts:[                        // mâchoire de gigachad + air sûr de lui
      [152,  .27,    0, .36],                           // menton bien allongé (sans tirer la lèvre du bas)
      [176,  .14, -.14, .28], [400,  .14, -.14, .28],   // menton large et carré
      [136,  .09, -.12, .24], [365,  .09, -.12, .24],   // mâchoire élargie, anguleuse
      [172,  .02, -.10, .22], [397,  .02, -.10, .22],
      [61,  -.07, -.05, .14], [291, -.02, -.03, .12],   // sourire en coin (un côté plus haut)
      [105, -.20,    0, .24], [70, -.12, 0, .20], [107, -.07, 0, .16],   // un sourcil levé haut, en entier (l'œil ne bouge pas, pas de pli)
      [334,  .06,  .03, .15], [296, .06, .04, .12], [300, .04, 0, .13],  // l'autre bas et lourd
      [159,  .035,   0, .08], [386, .045,  0, .08],     // yeux plissés
      [145, -.02,    0, .07], [374, -.02,  0, .07],
      [116, -.03, -.02, .12], [345, -.03, -.02, .12]    // pommettes marquées
    ]},
    chad1: { name:'🗿 Chad', pts:[                       // ancienne version (nom SAMMI « chad1 ») si la nouvelle plaît moins
      [152,  .22,    0, .38],                           // menton allongé
      [148,  .17, -.06, .24], [377,  .17, -.06, .24],   // menton large et carré
      [176,  .14, -.09, .22], [400,  .14, -.09, .22],
      [136,  .08, -.10, .22], [365,  .08, -.10, .22],   // mâchoire élargie, anguleuse
      [172,  .02, -.09, .22], [397,  .02, -.09, .22],
      [17,   .04,    0, .12],                           // bas du visage allongé
      [61,  -.07, -.05, .14], [291, -.02, -.03, .12],   // sourire en coin (un côté plus haut)
      [105, -.16,    0, .15], [66, -.12,  0, .13], [70, -.07, 0, .14],   // un sourcil arqué très haut
      [334,  .06,  .03, .15], [296, .06, .04, .12], [300, .04, 0, .13],  // l'autre bas et lourd
      [159,  .035,   0, .08], [386, .045,  0, .08],     // yeux plissés
      [145, -.02,    0, .07], [374, -.02,  0, .07],
      [116, -.03, -.02, .12], [345, -.03, -.02, .12]    // pommettes marquées
    ]},
    fache: { name:'😠 Colère', stk:'fache', pts:[      // la colère qui bout : regard noir rouge, visage qui rougit, vapeur…
      [107,  .15,  .09, .20], [336,  .15,  .09, .20],   // bouts intérieurs des sourcils : très bas et serrés
      [105,  .06,  .03, .16], [334,  .06,  .03, .16],
      [70,  -.06,    0, .16], [300, -.06,    0, .16],   // bouts extérieurs qui remontent → V
      [157,  .06,    0, .09], [384,  .06,    0, .09],   // yeux en fente, en biais : regard noir
      [160,  .03,    0, .08], [387,  .03,    0, .08],
      [145, -.04,    0, .09], [374, -.04,    0, .09],
      // bouche de colère (lèvres serrées et pincées, coins tirés vers le bas en arc, menton qui remonte)
      [61,   .15,  .02, .12], [291,  .15,  .02, .12],
      [40,   .05,    0, .09], [270,  .05,    0, .09], [91,  .06, 0, .09], [321, .06, 0, .09],
      [0,    .025,   0, .08], [17,  -.045,   0, .10],
      [152, -.06,    0, .20],
      [98,     0, -.03, .07], [327,    0, -.03, .07]    // narines qui se gonflent
    ], anim:el => {                                     // ça tremble de rage quand la vapeur sort
      if (!fumeOn(el)) return [];
      return [[1, .011 * Math.sin(el * 91), .011 * Math.sin(el * 67 + 1), 1.5]];
    }},
    /* 🤯 Exagéré : tête gonflée + TES expressions exagérées en direct (bouche ouverte → énorme, sourire → jusqu'aux oreilles…) */
    exagere: { name:'🤯 Exagéré', dyn:true, bulge:[
      [[1, 4, 6], 1.3, 1.6, .14]                          // tête un peu gonflée (une seule loupe : pas de plis)
    ]},
    chat: { name:'🐱 Kawai', stk:'chat', bulge:[
      [EYE_R, .52, .47, .68], [EYE_L, .52, .47, .68]    // yeux globuleux
    ]}
  };
  /* Exagéré : déformations recalculées à chaque image d'après tes expressions (0 → 1), amplifiées */
  const EXA_IDS = [152, 148, 377, 176, 400, 17, 14, 13, 84, 314, 61, 291, 50, 280, 145, 374, 159, 386, 107, 336, 105, 334, 70, 300, 1, 132, 361, 58, 288];
  const exagereDyn = b => {
    const v = n => b[n] || 0, avg = (a, c) => (v(a) + v(c)) / 2;
    const j = Math.max(v('jawOpen'), .6 * avg('mouthLowerDownLeft', 'mouthLowerDownRight'));
    const sm = avg('mouthSmileLeft', 'mouthSmileRight'), fr = avg('mouthFrownLeft', 'mouthFrownRight');
    const bu = v('browInnerUp'), bd = avg('browDownLeft', 'browDownRight'), bo = avg('browOuterUpLeft', 'browOuterUpRight');
    const ew = avg('eyeWideLeft', 'eyeWideRight'), sq = Math.max(avg('eyeSquintLeft', 'eyeSquintRight'), .7 * avg('eyeBlinkLeft', 'eyeBlinkRight'));
    const pk = v('mouthPucker'), sn = avg('noseSneerLeft', 'noseSneerRight'), cp = v('cheekPuff');
    const P = {};
    const add = (i, d, n, rad) => { const q = P[i] || (P[i] = [0, 0, 0]); q[0] += d; q[1] += n; q[2] = Math.max(q[2], rad); };
    // visage gonflé par les bords (le centre — nez, bouche — ne bouge pas) ; encore plus si tu gonfles les joues
    add(132, .02, -.12 - .1 * cp, .34); add(361, .02, -.12 - .1 * cp, .34);
    add(58, .05, -.12 - .1 * cp, .32); add(288, .05, -.12 - .1 * cp, .32);
    // bouche ouverte → la bouche devient énorme (loupe qui suit l'ouverture) et le menton s'allonge.
    // Pas de points sur les lèvres : additionnés, ils repliaient l'image (lèvre du haut « en miroir »).
    add(152, .44 * j, 0, .6); add(148, .3 * j, .03 * j, .44); add(377, .3 * j, .03 * j, .44);
    // sourire → jusqu'aux oreilles, joues qui montent, yeux plissés
    add(61, -.22 * sm, -.15 * sm, .26); add(291, -.22 * sm, -.15 * sm, .26);
    add(50, -.1 * sm, 0, .2); add(280, -.1 * sm, 0, .2); add(145, -.045 * sm, 0, .09); add(374, -.045 * sm, 0, .09);
    // moue triste · bisou
    add(61, .3 * fr, .03 * fr, .2); add(291, .3 * fr, .03 * fr, .2); add(61, 0, .18 * pk, .22); add(291, 0, .18 * pk, .22);
    // sourcils
    add(107, -.2 * bu + .16 * bd, .06 * bd, .18); add(336, -.2 * bu + .16 * bd, .06 * bd, .18);
    add(105, -.15 * bu - .1 * bo + .08 * bd, 0, .17); add(334, -.15 * bu - .1 * bo + .08 * bd, 0, .17);
    add(70, -.16 * bo + .05 * bd, 0, .17); add(300, -.16 * bo + .05 * bd, 0, .17);
    // yeux écarquillés / plissés : gérés par les loupes des yeux (plus bas)
    add(1, -.08 * sn, 0, .16);                               // nez qui se retrousse
    const pts = [];
    for (const i in P) { const q = P[i]; if (Math.abs(q[0]) + Math.abs(q[1]) > .004) pts.push([+i, q[0], q[1], q[2]]); }
    const bulge = FX.exagere.bulge.slice();
    if (j > .03) bulge.push([[13, 14], .95 + .2 * j, .6 + .42 * j, .86 * Math.min(1, j * 1.15)]);   // bouche ouverte → énorme
    const eb = Math.max(-.65, Math.min(.78, .12 + .6 * ew + .25 * bu - .6 * sq));   // yeux : écarquillés → énormes, plissés → minuscules
    if (Math.abs(eb) > .03) bulge.push([EYE_R, .5, .45, eb], [EYE_L, .5, .45, eb]);
    return { pts, bulge };
  };

  /* points à suivre pour chaque filtre (déformations + loupes + autocollants) */
  const FACE_OVAL = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377,
                     152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];   // tour du visage
  const EYE_RING = [[33, 246, 161, 160, 159, 158, 157, 173, 133, 155, 154, 153, 145, 144, 163, 7],
                    [263, 466, 388, 387, 386, 385, 384, 398, 362, 382, 381, 380, 374, 373, 390, 249]];   // contour des yeux
  const STK_PTS = { chat:[10, 1, 205, 425], pleure:[145, 374, 133, 362], derriere:[10, 152, 1, 234, 454],
                    content:[468, 473].concat(EYE_R, EYE_L), fache:[468, 469, 470, 471, 472, 473, 474, 475, 476, 477, 9, 297, 332].concat(EYE_RING[0], EYE_RING[1], FACE_OVAL) };
  Object.values(FX).forEach(f => {
    const need = new Set([33, 263]);
    (f.pts || []).forEach(q => need.add(q[0]));
    (f.bulge || []).forEach(b => b[0].forEach(i => need.add(i)));
    (STK_PTS[f.stk] || []).forEach(i => need.add(i));
    if (f.dyn) EXA_IDS.concat([205, 187, 425, 411, 4, 6], MOUTH, EYE_R, EYE_L).forEach(i => need.add(i));
    f.need = [...need];
  });

  /* --- Moteur de suivi : chargé une fois, puis au repos (aucun calcul hors filtre) --- */
  let lm = null, lmP = null, lmState = 'off', lmGpu = null, lmTs = 0;
  const lmTime = () => (lmTs = Math.max(lmTs + 1, performance.now()));   // horodatage toujours croissant (exigé par MediaPipe)
  const ensureLM = () => lmP || (lmP = (async () => {
    lmState = 'load';
    const V = await import(MP_BASE + '/vision_bundle.mjs');
    const files = await V.FilesetResolver.forVisionTasks(MP_BASE + '/wasm');
    const make = delegate => V.FaceLandmarker.createFromOptions(files, {
      baseOptions:{ modelAssetPath:MP_MODEL, delegate }, runningMode:'VIDEO', numFaces:1,
      outputFaceBlendshapes:true                            // coefficients d'expression (bouche ouverte, sourire…) : filtre « exagéré »
    });
    try { lm = await make('GPU'); lmGpu = true; }
    catch (_) { lm = await make('CPU'); lmGpu = false; }   // GPU indispo → processeur (plus lent)
    try {                                                  // échauffement à vide : le 1er filtre démarre sans à-coup
      const w = document.createElement('canvas'); w.width = w.height = 64;
      w.getContext('2d').fillRect(0, 0, 64, 64);
      lm.detectForVideo(w, lmTime());
    } catch (_) {}
    lmState = 'ok';
    if (C.PAAT_DETOURAGE) ensureSeg().catch(() => {});     // détourage (0,25 Mo) prêt d'avance aussi, s'il sert
    return lm;
  })().catch(e => { lmP = null; lmState = 'err'; ST.err = 'moteur : ' + (e.message || e); throw e; }));

  /* --- Déformation WebGL : chaque point « tire » les pixels autour de lui (atténuation douce) --- */
  const FX_N = 32, FX_B = 8;                                 // points de déformation / loupes max par filtre
  const VS = 'attribute vec2 a;varying vec2 v;'
           + 'void main(){v=vec2((a.x+1.)*.5,(1.-a.y)*.5);gl_Position=vec4(a,0.,1.);}';
  const FS = '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n'
           + 'uniform sampler2D t;uniform vec2 res;uniform int n;uniform int nb;'
           + 'uniform vec2 c[' + FX_N + '];uniform vec2 dd[' + FX_N + '];uniform float r[' + FX_N + '];'
           + 'uniform vec4 bc[' + FX_B + '];uniform vec4 bd[' + FX_B + '];varying vec2 v;'
           + 'void main(){vec2 p=v*res;vec2 s=p;'
           // loupes : grossissement doux dans une ellipse qui suit l'inclinaison de la tête
           + 'for(int i=0;i<' + FX_B + ';i++){if(i>=nb)break;vec2 d=s-bc[i].xy;vec2 ax=bd[i].xy;vec2 ay=vec2(-ax.y,ax.x);'
           + 'float u=dot(d,ax)/bc[i].z;float w=dot(d,ay)/bc[i].w;float t2=u*u+w*w;'
           + 'if(t2<1.){float f=1.-t2;s=bc[i].xy+d*(1.-bd[i].z*f*f);}}'
           // déformations : chaque point tire les pixels autour de lui
           + 'vec2 o=vec2(0.);'
           + 'for(int i=0;i<' + FX_N + ';i++){if(i>=n)break;vec2 q=p-c[i];o+=dd[i]*exp(-dot(q,q)/(r[i]*r[i]));}'
           + 'gl_FragColor=texture2D(t,clamp((s-o)/res,0.,1.));}';
  const fxCv = cv;                                           // calque affiché dans OBS (2D)
  const glCv = document.createElement('canvas');             // déformation (WebGL, hors écran)
  let glp = null, out2d = null;
  glCv.addEventListener('webglcontextlost', e => { e.preventDefault(); glp = null; if (fx.on) fxEnd(true); });
  const glInit = () => {
    if (!out2d) out2d = fxCv.getContext('2d', { alpha:false });
    if (glp) return glp;
    const gl = glCv.getContext('webgl', { alpha:false, antialias:false, depth:false, stencil:false,
                                          premultipliedAlpha:false, preserveDrawingBuffer:false, powerPreference:'high-performance' });
    if (!gl) throw new Error('WebGL indisponible');
    const sh = (type, src) => {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const a = gl.getAttribLocation(pr, 'a');
    gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
    [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
    const u = k => gl.getUniformLocation(pr, k);
    glp = { gl, res:u('res'), n:u('n'), c:u('c'), d:u('dd'), r:u('r'), nb:u('nb'), bc:u('bc'), bd:u('bd') };
    gl.uniform1i(u('t'), 0);
    return glp;
  };


  /* ============================================================
     Calque bureau : état, suivi, dessin (propre à cette page)
     ============================================================ */
  FX.derriere.keep = true;                           // Paatrice : reste à l'écran quand tu es de profil (PAAT_HOLD)
  const fx = { on:false, ending:false, key:'', t0:0, face:0, seen:0, miss:0, sm:{}, bs:{}, fg:1, n:0, nb:0, k:0,
               parts:[], guy:null, mask:false, last:0, now:0, tDet:0, lastFrame:0, track:null,
               rvfc:0, raf:0, useRaf:false, got:false, drawn:null, q:-1 };
  const fxQ = [];
  const bufC = new Float32Array(FX_N * 2), bufD = new Float32Array(FX_N * 2), bufR = new Float32Array(FX_N);
  const bufBC = new Float32Array(FX_B * 4), bufBD = new Float32Array(FX_B * 4);

  /* lissage + vitesse de chaque point (pour prédire entre deux suivis) */
  const sm = (p, i, W, H, t) => {
    const q = p[i]; if (!q) return;
    const x = q.x * W, y = q.y * H, o = fx.sm[i];
    if (!o) { fx.sm[i] = [x, y, 0, 0]; return; }
    const nx = o[0] + (x - o[0]) * C.SMOOTH, ny = o[1] + (y - o[1]) * C.SMOOTH, gap = t - fx.tDet;
    if (fx.tDet && gap > 0 && gap < 120) { o[2] = o[2] * .5 + (nx - o[0]) / gap * .5; o[3] = o[3] * .5 + (ny - o[1]) / gap * .5; }
    else { o[2] = 0; o[3] = 0; }
    o[0] = nx; o[1] = ny;
  };
  const at = i => {                                  // position du point à l'instant de l'image affichée
    const o = fx.sm[i]; if (!o) return null;
    if (!C.PREDICT) return o;
    const a = Math.min(Math.max(0, fx.now - fx.tDet), 50);
    return [o[0] + o[2] * a, o[1] + o[3] * a];
  };

  const frame = () => {
    if (!fx.on) return;
    const v = vid, W = v.videoWidth, H = v.videoHeight, t = performance.now();
    const dt = Math.min(0.1, (t - (fx.last || t)) / 1000);
    fx.last = fx.now = t; ST.frames++;
    if (!fx.useRaf) fx.lastFrame = t;
    else {                                           // secours : on vérifie que l'image avance vraiment
      const q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality().totalVideoFrames : -1;
      if (q !== fx.q) { fx.q = q; fx.lastFrame = t; }
    }
    if (W && H && glp) {
      const RS = Math.min(1, C.RENDER_SCALE || 1), cw = Math.round(W * RS), ch = Math.round(H * RS);   // taille de calcul du calque
      if (fxCv.width !== cw || fxCv.height !== ch) { fxCv.width = glCv.width = cw; fxCv.height = glCv.height = ch; }
      const F = FX[fx.key];

      /* 1. Suivi du visage (DETECT_FPS fois par seconde) + expressions + détourage */
      if (lm && t - fx.tDet >= 1000 / C.DETECT_FPS - 4) {
        const t0 = performance.now(); let p = null, res = null;
        try { res = lm.detectForVideo(v, lmTime()); p = res && res.faceLandmarks && res.faceLandmarks[0]; } catch (_) {}
        const bsc = res && res.faceBlendshapes && res.faceBlendshapes[0] && res.faceBlendshapes[0].categories;
        if (bsc) for (const c of bsc) fx.bs[c.categoryName] = (fx.bs[c.categoryName] || 0) * .45 + c.score * .55;   // lissé
        fx.miss = p ? 0 : fx.miss + 1;
        if (p) { fx.seen = t; F.need.forEach(i => sm(p, i, cw, ch, t)); }
        fx.tDet = t;
        if (F.seg && seg && C.PAAT_DETOURAGE) try { segStep(v, cw, ch); } catch (e) { log('SEG ' + e.message); }
        const ms = performance.now() - t0;
        ST.dets++; ST.detMs += ms; if (ms > ST.detMax) ST.detMax = ms;
      }
      const faceOn = fx.seen && fx.miss < 3;
      fx.face = Math.max(0, Math.min(1, fx.face + (faceOn ? 1 : -1) * dt / 0.25));

      /* 2. Intensité : montée, maintien, descente */
      const el = fx.t0 ? (t - fx.t0) / 1000 : 0, fd = Math.max(0.1, C.FILTER_FADE), D = Math.max(3, C.FILTER_DURATION);
      const amt = fx.t0 ? Math.max(0, Math.min(1, el / fd, (D - el) / fd)) : 0;
      if (fx.t0 && el >= D && !fx.ending) fxEnd();
      const lvl = (C.FILTER_LEVELS && C.FILTER_LEVELS[fx.key] != null) ? C.FILTER_LEVELS[fx.key] : 1;
      const k = (C.FILTER_STRENGTH == null ? 1 : C.FILTER_STRENGTH) * lvl * amt * fx.face;

      /* 3. Loupes et points, dans le repère du visage (suit l'inclinaison de la tête) */
      let n = 0, nb = 0, pose = null;
      const e1 = at(33), e2 = at(263);
      const DY = F.dyn ? exagereDyn(fx.bs) : null;
      if (e1 && e2) {
        const ex = e2[0] - e1[0], ey = e2[1] - e1[1], fw = Math.hypot(ex, ey) || 1;
        const rx = ex / fw, ry = ey / fw, dx = -ry, dy = rx, mx = (e1[0] + e2[0]) / 2, my = (e1[1] + e2[1]) / 2;
        pose = { fw, rx, ry, dx, dy, mx, my };
        if (k > 0.001) for (const [ids, bw, bh, bs] of ((DY ? DY.bulge : F.bulge) || [])) {
          if (nb >= FX_B) break;
          let cx = 0, cy = 0, m = 0;
          for (const i of ids) { const q = at(i); if (q) { cx += q[0]; cy += q[1]; m++; } }
          if (!m) continue;
          bufBC[nb * 4] = cx / m; bufBC[nb * 4 + 1] = cy / m; bufBC[nb * 4 + 2] = bw * fw; bufBC[nb * 4 + 3] = bh * fw;
          bufBD[nb * 4] = rx; bufBD[nb * 4 + 1] = ry;
          bufBD[nb * 4 + 2] = Math.max(-0.9, Math.min(0.9, bs * k));   // au-delà de 0,9 l'image se retournerait
          nb++;
        }
        if (k > 0.001) for (const [i, kd, ki, kr] of ((DY ? DY.pts : (F.anim ? F.pts.concat(F.anim(el)) : F.pts)) || [])) {
          let p = at(i); if (!p || n >= FX_N) continue;
          if ((F.inv || F.dyn) && nb) p = bulgeInv(p, nb);          // le point suit le trait là où la loupe l'a déplacé
          const sd = Math.sign((p[0] - mx) * rx + (p[1] - my) * ry);
          let ox = (dx * kd - rx * sd * ki) * fw * k, oy = (dy * kd - ry * sd * ki) * fw * k;
          const rad = kr * fw, L = Math.hypot(ox, oy), mxL = rad * 0.75;   // au-delà l'image se replierait
          if (L > mxL) { ox *= mxL / L; oy *= mxL / L; }
          bufC[n * 2] = p[0] + ox; bufC[n * 2 + 1] = p[1] + oy;
          bufD[n * 2] = ox;        bufD[n * 2 + 1] = oy;
          bufR[n] = rad; n++;
        }
      }
      if (n && pose && F.dyn) {                      // garde-fou anti-« miroir » (Exagéré, qui suit tes expressions)
        const g = foldGuard(n, nb, pose);
        fx.fg = g < fx.fg ? g : fx.fg + (g - fx.fg) * Math.min(1, dt * 3);   // baisse tout de suite, remonte en douceur
        if (fx.fg < .999) for (let i = 0; i < n; i++) {
          const bx = bufC[i * 2] - bufD[i * 2], by = bufC[i * 2 + 1] - bufD[i * 2 + 1];
          bufD[i * 2] *= fx.fg; bufD[i * 2 + 1] *= fx.fg;
          bufC[i * 2] = bx + bufD[i * 2]; bufC[i * 2 + 1] = by + bufD[i * 2 + 1];
        }
      }
      fx.n = n; fx.nb = nb; fx.k = k;

      /* 4. Dessin : déformation (WebGL) puis dessins animés par-dessus (2D) */
      out2d.setTransform(1, 0, 0, 1, 0, 0);
      out2d.globalAlpha = 1;
      if (n || nb) {
        const gl = glp.gl;
        gl.viewport(0, 0, cw, ch);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, v);
        gl.uniform2f(glp.res, cw, ch); gl.uniform1i(glp.n, n); gl.uniform1i(glp.nb, nb);
        gl.uniform2fv(glp.c, bufC); gl.uniform2fv(glp.d, bufD); gl.uniform1fv(glp.r, bufR);
        gl.uniform4fv(glp.bc, bufBC); gl.uniform4fv(glp.bd, bufBD);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        out2d.drawImage(glCv, 0, 0);
      } else out2d.drawImage(v, 0, 0, cw, ch);       // rien à déformer : image directe
      const st = F.stk, sa = F.keep ? amt : amt * fx.face;   // Paatrice reste même si le suivi te perd un instant
      if (st && pose && sa > 0.01) try { STK[st](out2d, pose, sa, el, dt, v, cw, ch); } catch (e) { log('STK ' + st + ' : ' + e.message); }

      /* 5. Le calque ne couvre la cam que si ton visage est vu ET que l'image est bien en 16:9
            (sinon : cam normale, jamais d'image parasite ni déformée à l'antenne) */
      const okRatio = RAW || ratioOK(W, H);
      if (!okRatio) ST.err = 'image ' + W + '×' + H + ' au lieu de 16:9 → calque masqué';
      const want = RAW ? !!(fx.t0 && !fx.ending)
                       : !!(okRatio && fx.t0 && !fx.ending && fx.seen && t - fx.seen < (F.keep ? C.PAAT_HOLD : C.FACE_HOLD) * 1000);
      if (want !== fxCv.classList.contains('on')) fxCv.classList.toggle('on', want);
      if (fx.drawn) { fx.drawn(); fx.drawn = null; }
    }
    sched();
  };
  /* une image dessinée par image caméra ; secours au rythme de la source navigateur */
  const sched = () => {
    if (!fx.on) return;
    if (fx.useRaf) fx.raf = requestAnimationFrame(frame);
    else fx.rvfc = vid.requestVideoFrameCallback(() => { fx.got = true; frame(); });
  };

  /* Garde-fou anti-« miroir » : quand plusieurs déformations s'additionnent (ex. bouche grande ouverte),
     l'image peut se replier sur elle-même (une lèvre en double, à l'envers). On mesure ce repli sur
     tout le visage et on atténue les déformations juste assez pour qu'il n'arrive jamais. */
  const FG_MIN = .1;
  const foldGuard = (n, nb, P) => {
    const { fw, rx, ry, dx, dy, mx, my } = P, h = .01 * fw;
    const B = (x, y) => {                                    // même calcul que le shader (loupes)
      for (let i = 0; i < nb; i++) {
        const cx = bufBC[i * 4], cy = bufBC[i * 4 + 1], ax = bufBD[i * 4], ay = bufBD[i * 4 + 1];
        const qx = x - cx, qy = y - cy, u = (qx * ax + qy * ay) / bufBC[i * 4 + 2], w = (-qx * ay + qy * ax) / bufBC[i * 4 + 3];
        const t2 = u * u + w * w;
        if (t2 < 1) { const f = 1 - t2, m = 1 - bufBD[i * 4 + 2] * f * f; x = cx + qx * m; y = cy + qy * m; }
      }
      return [x, y];
    };
    const S = [];
    for (let i = 0; i < n; i++) {                             // là où chaque point tire le plus fort…
      const ox = bufD[i * 2], oy = bufD[i * 2 + 1], L = Math.hypot(ox, oy) || 1, r = bufR[i];
      for (const t of [0, .35, .7, 1.05]) S.push(bufC[i * 2] - ox / L * r * t, bufC[i * 2 + 1] - oy / L * r * t);
    }
    for (let a = -1.3; a <= 1.31; a += .26) for (let b = -1.2; b <= 2.21; b += .26) S.push(mx + (rx * a + dx * b) * fw, my + (ry * a + dy * b) * fw);   // … et tout le visage
    const JB = new Float32Array(S.length * 2);
    for (let j = 0; j < S.length; j += 2) {                  // loupes : dérivées une fois pour toutes
      const x = S[j], y = S[j + 1], a = B(x - h, y), b = B(x + h, y), c = B(x, y - h), d = B(x, y + h);
      JB[j * 2] = (b[0] - a[0]) / (2 * h); JB[j * 2 + 1] = (d[0] - c[0]) / (2 * h);
      JB[j * 2 + 2] = (b[1] - a[1]) / (2 * h); JB[j * 2 + 3] = (d[1] - c[1]) / (2 * h);
    }
    const worst = sc => {                                    // repli le plus fort si on garde sc × les déformations
      let mn = 9;
      for (let j = 0; j < S.length; j += 2) {
        const px = S[j], py = S[j + 1];
        let a = JB[j * 2], b = JB[j * 2 + 1], c = JB[j * 2 + 2], d = JB[j * 2 + 3];
        const d0 = a * d - b * c;
        for (let i = 0; i < n; i++) {
          const ox = bufD[i * 2] * sc, oy = bufD[i * 2 + 1] * sc;
          const qx = px - (bufC[i * 2] - bufD[i * 2] + ox), qy = py - (bufC[i * 2 + 1] - bufD[i * 2 + 1] + oy), r2 = bufR[i] * bufR[i];
          const e = (qx * qx + qy * qy) / r2; if (e > 9) continue;
          const kk = -2 * Math.exp(-e) / r2;
          a -= ox * kk * qx; b -= ox * kk * qy; c -= oy * kk * qx; d -= oy * kk * qy;
        }
        const q = (a * d - b * c) / Math.max(.02, d0);
        if (q < mn) { mn = q; if (window.__fx && sc === 1) window.__fgw = { j:j / 2, x:(px - mx) / fw, y:(py - my) / fw, q:+q.toFixed(3), a:+a.toFixed(2), b:+b.toFixed(2), c:+c.toFixed(2), d:+d.toFixed(2) }; }
      }
      return mn;
    };
    if (worst(1) >= FG_MIN) return 1;
    let lo = 0, hi = 1;
    for (let it = 0; it < 6; it++) { const m = (lo + hi) / 2; if (worst(m) >= FG_MIN) lo = m; else hi = m; }
    return lo;
  };

  /* --- Autocollants qui suivent la tête (dessinés ici : aucune image à héberger) --- */
  const rnd = (a, b) => a + Math.random() * (b - a);
  const backOut = x => { x = Math.min(1, Math.max(0, x)) - 1; return 1 + 2.70158 * x * x * x + 1.70158 * x * x; };
  const mk = (w, h, f) => { const c = document.createElement('canvas'); c.width = w; c.height = h; f(c.getContext('2d'), w, h); return c; };
  const heartPath = (g, x, y, w) => {                        // cœur : (x, y) = milieu du haut
    const h = w * .92;
    g.beginPath();
    g.moveTo(x, y + h * .28);
    g.bezierCurveTo(x - w * .1, y - h * .08, x - w * .52, y - h * .02, x - w * .5, y + h * .32);
    g.bezierCurveTo(x - w * .48, y + h * .6, x - w * .14, y + h * .8, x, y + h);
    g.bezierCurveTo(x + w * .14, y + h * .8, x + w * .48, y + h * .6, x + w * .5, y + h * .32);
    g.bezierCurveTo(x + w * .52, y - h * .02, x + w * .1, y - h * .08, x, y + h * .28);
    g.closePath();
  };
  const glitter = (g, n, x0, y0, x1, y1) => {
    for (let i = 0; i < n; i++) {
      g.globalAlpha = rnd(.45, 1); g.fillStyle = Math.random() < .6 ? '#fff' : '#ffd1ea';
      g.beginPath(); g.arc(rnd(x0, x1), rnd(y0, y1), rnd(.8, 2.4), 0, 6.283); g.fill();
    }
    g.globalAlpha = 1;
  };
  const star4 = (g, x, y, r) => {                            // petite étincelle à 4 branches
    g.beginPath();
    g.moveTo(x, y - r); g.quadraticCurveTo(x, y, x + r, y); g.quadraticCurveTo(x, y, x, y + r);
    g.quadraticCurveTo(x, y, x - r, y); g.quadraticCurveTo(x, y, x, y - r); g.fill();
  };
  /* Paatrice (personnage de la chaîne), redessiné ici au pinceau : boule rouge texturée,
     sourcils épais, grands yeux blancs. Pupilles et clignement dessinés en direct. */
  const P_INK = '#1c0d0a', P_RED = '#c73529';
  const P_EYES = [[142, 250, 70, 68, -.08], [370, 232, 73, 70, .24]];   // [x, y, rayon x, rayon y, inclinaison pupille]
  const brush = (g, pts, w, rng) => {                        // trait « pinceau sec » : bord irrégulier + grain
    g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = P_INK;
    for (let k = 0; k < 3; k++) {
      g.globalAlpha = k ? .55 : 1; g.lineWidth = w * (k ? .85 : 1);
      g.beginPath();
      pts.forEach(([x, y], i) => { const jx = k ? rng(-1.6, 1.6) : 0, jy = k ? rng(-1.6, 1.6) : 0; i ? g.lineTo(x + jx, y + jy) : g.moveTo(x + jx, y + jy); });
      g.stroke();
    }

      const L2G = (lx, ly) => { const x = (lx - 256) * k, y = (ly - 256) * k; return [hx + x * cs - y * sn, hy + x * sn + y * cs]; };
      g.save(); g.translate(hx, hy); g.rotate(rot); g.scale(k, k); g.translate(-256, -256);
      g.drawImage(S.pbody, -144, 380);                       // torse nu
      paatDraw(g, S, gy.look, blink);                        // tête
      g.restore();
      /* bras tendu vers toi + doigt d'honneur à hauteur de ta tête (sous la sienne) */
      const ap = (el < 1 ? 0 : backOut((el - 1) / .4)) * Math.min(1, a * 2) * (1 - Math.min(1, hide * 1.6)) * (gy.sw ? 0 : 1);
      let hand = null;
      if (ap > 0.01) {
        const S0 = L2G(256 + sd * 230, 600);                 // son épaule extérieure
        const pump = .08 * Math.abs(Math.sin(el * 3.4));     // il te le « pousse » vers toi en rythme
        const Wt = G(sd * (1.3 - pump), 1.1), R0 = L2G(256 + sd * 120, 760);    // poignet : cible / repos
        const W0 = [R0[0] + (Wt[0] - R0[0]) * ap, R0[1] + (Wt[1] - R0[1]) * ap];
        paatArm(g, S0, W0, k, [dx * .35 * fw, dy * .35 * fw], C.PAAT_BRAS, el, false);
        hand = [W0, 1.2 * fw * (.4 + .6 * ap), roll - sd * .55 + .06 * Math.sin(el * 6.8), sd > 0, Math.min(1, ap * 3)];   // pouce vers l'extérieur
      }
      if (fx.mask) g.drawImage(personLayer(v, W, H), 0, 0); // (détourage actif seulement) toi par-dessus → il est DERRIÈRE
      if (hand) paatHand(g, ...hand);                        // la main arrive DEVANT toi
    }
  };


  /* ============================================================
     Caméra virtuelle, démarrage / fin, déclencheur, panneau
     ============================================================ */
  const CAM_RE = new RegExp(C.CAM_LABEL.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
  const camMsg = e => !e ? 'erreur'
    : e.name === 'NotAllowedError'      ? 'accès refusé (OBS lancé sans --enable-media-stream ?)'
    : e.name === 'NotReadableError'     ? 'caméra virtuelle occupée ou pas démarrée'
    : e.name === 'OverconstrainedError' ? 'caméra virtuelle introuvable'
    : (e.message || e.name);
  const findCam = async () => {
    if (!md || !md.getUserMedia) throw new Error('pas d\'accès caméra (--enable-media-stream ?)');
    const list = async () => (await md.enumerateDevices()).filter(d => d.kind === 'videoinput');
    let cams = await list(), hit = cams.find(d => CAM_RE.test(d.label));
    ST.devs = cams.map(d => d.label || '?').join(' | ');
    if (hit) return hit.deviceId;
    if (!cams.some(d => d.label)) {                  // noms cachés : on les débloque par le micro (ne touche jamais à l'Elgato)
      try { const s = await md.getUserMedia({ audio:true }); s.getTracks().forEach(tr => tr.stop()); } catch (_) {}
      cams = await list(); hit = cams.find(d => CAM_RE.test(d.label));
      if (hit) return hit.deviceId;
    }
    throw new Error(cams.some(d => d.label)
      ? 'caméra virtuelle introuvable. Vues : ' + cams.map(d => d.label || '?').join(', ')
      : 'noms des caméras cachés (--enable-media-stream ?)');
  };

  /* Caméra virtuelle allumée par la page (VCAM_AUTO) : fonctions intégrées d'OBS (window.obsstudio),
     présentes seulement si la source navigateur a « Accès complet à OBS ». On n'éteint que ce que la page a allumé. */
  const OBS = window.obsstudio, VKEY = 'cambureau.vcam';
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const vcamCan = () => !!(C.VCAM_AUTO && OBS && OBS.startVirtualcam && OBS.stopVirtualcam && OBS.getStatus);
  const vcamStatus = () => new Promise(r => {
    if (!OBS || !OBS.getStatus) return r(null);
    setTimeout(() => r(null), 1000);
    try { OBS.getStatus(s => r(!!(s && s.virtualcam))); } catch (_) { r(null); }
  });
  let vcamOurs = false, vcamStopT = 0;
  const flag = on => { try { on ? localStorage.setItem(VKEY, '1') : localStorage.removeItem(VKEY); } catch (_) {} };
  const vcamOn = async () => {
    clearTimeout(vcamStopT);
    if (!vcamCan() || await vcamStatus()) return;    // pas d'accès, ou déjà allumée
    OBS.startVirtualcam(); vcamOurs = true; flag(true);
    for (let i = 0; i < 25 && !(await vcamStatus()); i++) await sleep(120);   // ≈ 0,3 à 1 s
    if (!(await vcamStatus())) throw new Error('la caméra virtuelle ne démarre pas');
    await sleep(C.VCAM_WARMUP * 1000);
  };
  const vcamOff = now => {
    clearTimeout(vcamStopT);
    if (!vcamOurs) return;
    const off = () => { if (fx.on || fxQ.length) return; try { OBS.stopVirtualcam(); } catch (_) {} vcamOurs = false; flag(false); };
    if (now) off(); else vcamStopT = setTimeout(off, C.VCAM_STOP_DELAY * 1000);
  };
  addEventListener('beforeunload', () => { if (vcamOurs) { try { OBS.stopVirtualcam(); } catch (_) {} flag(false); } });
  try {                                              // la page s'était fermée en plein filtre → on éteint ce qu'elle avait allumé
    if (vcamCan() && localStorage.getItem(VKEY) === '1') { OBS.stopVirtualcam(); flag(false); }
  } catch (_) {}

  /* Ouvre la caméra virtuelle dans son format d'origine (sans recadrage du navigateur).
     ⚠️ Le navigateur annonce la caméra virtuelle d'OBS « à l'envers » (1080×1920) alors que les images
     arrivent bien en 1920×1080 : on ne se fie donc qu'à la taille réelle des images (vérifiée à chaque image). */
  const ratioOK = (w, h) => w && h && Math.abs(w / h - C.WIDTH / C.HEIGHT) < 0.02;
  const openCam = id => md.getUserMedia({ video:{ deviceId:{ exact:id }, width:{ ideal:C.WIDTH }, height:{ ideal:C.HEIGHT },
                                                  frameRate:{ ideal:C.VIDEO_FPS }, resizeMode:{ ideal:'none' } } });

  const fxStart = async key => {
    if (fx.on) return;
    Object.assign(fx, { on:true, ending:false, key, t0:0, face:0, seen:0, miss:0, sm:{}, bs:{}, fg:1, parts:[], guy:null,
                        mask:false, last:0, tDet:0, lastFrame:performance.now(), useRaf:false, got:false, q:-1 });
    segPrev = null; segImg = null;
    ST.err = '';
    try {
      await ensureLM();
      if (FX[key].seg && C.PAAT_DETOURAGE) await ensureSeg().catch(() => {});
      glInit();
      if (FX[key].stk) sprites();                    // dessins préparés AVANT le compte à rebours
      await vcamOn();
      const id = await findCam();
      const s = await openCam(id);
      const tr = s.getVideoTracks()[0];
      if (!fx.on) { tr.stop(); return; }
      fx.track = tr; ST.cam = tr.label;
      try { const c = tr.getCapabilities(); ST.caps = (c.width && c.width.max) + '×' + (c.height && c.height.max); } catch (_) {}
      tr.addEventListener('ended', () => { ST.err = 'caméra virtuelle coupée'; fxEnd(true); });
      vid.srcObject = s;
      await vid.play();
      const first = new Promise((r, j) => { fx.drawn = r; setTimeout(() => j(new Error('pas d\'image de la caméra virtuelle')), 4000); });
      sched();
      setTimeout(() => {                             // images jamais signalées → mode secours
        if (fx.on && !fx.got) { try { vid.cancelVideoFrameCallback(fx.rvfc); } catch (_) {} fx.useRaf = true; sched(); }
      }, 700);
      await first;
      if (!fx.on) return;
      fx.t0 = performance.now();                     // le compte à rebours part maintenant
      log('filtre', key, 'lancé ·', tr.label, JSON.stringify(tr.getSettings()));
    } catch (e) {
      if (fx.on) { ST.err = camMsg(e); log('échec :', ST.err); await fxEnd(true); }
    }
  };
  const fxEnd = async failed => {
    if (!fx.on || fx.ending) return;
    fx.ending = true;
    const shown = fxCv.classList.contains('on');
    fxCv.classList.remove('on');                     // la cam normale réapparaît
    if (shown) await new Promise(r => setTimeout(r, C.OVERLAY_FADE * 1000 + 80));
    fxCleanup();
    if (fxQ.length) setTimeout(fxNext, failed ? 1500 : 300);
    else vcamOff();                                  // (VCAM_AUTO) plus rien en attente → caméra virtuelle éteinte
  };
  const fxCleanup = () => {
    fx.on = false; fx.ending = false; fx.t0 = 0; fx.drawn = null; fx.parts = []; fx.guy = null; fx.mask = false;
    cancelAnimationFrame(fx.raf);
    try { vid.cancelVideoFrameCallback(fx.rvfc); } catch (_) {}
    vid.srcObject = null;
    if (fx.track) fx.track.stop();                   // caméra fermée : plus rien ne calcule
    fx.track = null;
  };
  const fxNext = () => { if (!fx.on && fxQ.length) fxStart(fxQ.shift()); };

  /* garde-fou : plus d'image depuis 1 s → le calque s'efface (jamais d'image figée à l'antenne) */
  setInterval(() => {
    if (fx.on && fx.t0 && !fx.ending && performance.now() - fx.lastFrame > 1000) {
      ST.err = 'plus d\'image de la caméra virtuelle → calque retiré'; fxEnd(true);
    }
  }, 250);

  const FX_ALIAS = { kawai:'chat', kawaii:'chat', mad:'fache', colere:'fache', idee:'pleure', yeux:'mini', bouche:'derriere' };   // mêmes noms que la cam tel
  const fxRequest = d => {
    const m = (d && d.meta && typeof d.meta === 'object') ? d.meta : {};
    let key = String(m.nom || (d && d.nom) || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
    key = FX_ALIAS[key] || key;
    if (!FX[key]) { log('filtre inconnu :', key); return; }
    if (fx.on) { if (fxQ.length < C.FILTER_QUEUE_MAX) fxQ.push(key); return; }
    fxStart(key);
  };

  /* ---------- Déclencheur : Social Stream Ninja, canal 1 (comme la cam tel) ---------- */
  const handle = d => {
    if (!d || typeof d !== 'object') return;
    if (d.content) d = d.content;
    if (String(d.event || '').toLowerCase() === 'filtre_bureau' && C.FILTERS) fxRequest(d);
  };
  if (SESSION) {
    let ws = null, retry = null;
    const connect = () => {
      clearTimeout(retry);
      try {
        ws = new WebSocket('wss://io.socialstream.ninja/join/' + encodeURIComponent(SESSION) + '/1');
        ws.onopen  = () => { ST.ws = true; };
        ws.onmessage = ev => {
          let d;
          try { d = JSON.parse(ev.data); } catch (_) { return; }
          if (d && d.action && d.value !== undefined) d = d.value;
          if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) {} }
          if (d && d.overlayNinja) d = d.overlayNinja;
          if (d && typeof d === 'object' && (d.event || d.content)) handle(d);
        };
        ws.onclose = () => { ST.ws = false; retry = setTimeout(connect, 3000); };
        ws.onerror = () => { try { ws.close(); } catch (_) {} };
      } catch (_) { retry = setTimeout(connect, 3000); }
    };
    connect();
  }

  /* ---------- Panneau de mesures (&stats) ---------- */
  const f1 = x => x.toFixed(1).replace('.', ',');
  const hudPaint = () => {
    const s = fx.track && fx.track.readyState === 'live' ? fx.track.getSettings() : null;
    const el = fx.t0 ? Math.floor((performance.now() - fx.t0) / 1000) : 0;
    hud.textContent = [
      'CAM BUREAU · 9 filtres',
      'Moteur : ' + ({ ok:'prêt ✅ ' + (lmGpu ? 'GPU' : 'CPU ⚠️'), load:'préparation…', err:'erreur ⚠️', off:'en attente' }[lmState])
                  + (seg ? ' · détourage prêt' : ''),
      'SSN    : ' + (!SESSION ? 'pas de #chat= ⚠️' : ST.ws ? 'connecté ✅' : 'connexion…'),
      'Cam virtuelle : ' + (ST.vcam == null ? 'état inconnu' : ST.vcam ? 'allumée' : 'éteinte')
                  + (!C.VCAM_AUTO ? ' (gérée par SAMMI)' : vcamCan() ? ' (auto ✅)' : ' (auto impossible : « Accès complet à OBS » ?) ⚠️'),
      'Caméra : ' + (s ? (ST.cam || '?') + ' · ' + (vid.videoWidth || s.width) + '×' + (vid.videoHeight || s.height) + ' · ' + Math.round(s.frameRate || 0) + ' i/s' : 'fermée (repos)'),
      'Calque : ' + (fx.on ? ST.fps + ' i/s · calcul ' + fxCv.width + '×' + fxCv.height + ' · suivi ' + ST.dps + '/s · ' + f1(ST.avg) + ' ms (max ' + f1(ST.max) + ') · visage '
                             + (fx.face > .5 ? 'vu' : 'perdu') + (fx.useRaf ? ' · mode secours' : '') : '—'),
      'État   : ' + (fx.on ? FX[fx.key].name + (fx.t0 ? ' · ' + el + ' / ' + C.FILTER_DURATION + ' s' : ' · démarrage…') : 'repos')
                  + (fxQ.length ? ' · file ' + fxQ.length : ''),
      ST.err ? 'Erreur : ' + ST.err : '',
      RAW ? 'BRUT   : vidéo ' + vid.videoWidth + '×' + vid.videoHeight + ' · capacités ' + (ST.caps || '?')
            + '\nAppareils : ' + (ST.devs || '?') : ''
    ].filter(Boolean).join('\n');
  };
  setInterval(() => {
    ST.fps = ST.frames; ST.dps = ST.dets; ST.avg = ST.dets ? ST.detMs / ST.dets : 0; ST.max = ST.detMax;
    ST.frames = 0; ST.dets = 0; ST.detMs = 0; ST.detMax = 0;
    if (hud.classList.contains('on')) { vcamStatus().then(v => { ST.vcam = v; }); hudPaint(); }
  }, 1000);
  if (has('stats')) { hud.classList.add('on'); hudPaint(); }

  /* ---------- Lancement ---------- */
  if (C.FILTERS && C.FILTER_PRELOAD) setTimeout(() => ensureLM().catch(() => {}), 1500);
  if (has('test')) setTimeout(() => fxRequest({ meta:{ nom:get('test') || 'zinzin' } }), 5000);
})();
</script>
