<script>
/* ============================================================
   CAM BUREAU — calque « filtres visage » pour OBS
   Les 9 filtres de la cam tel (code repris tel quel de camtel.html).

   La vraie source caméra (ZV-1F → HD60 S, source « WEB CAM ») reste intacte.
   Cette page est une SOURCE NAVIGATEUR (« Filtres cam ») posée juste au-dessus :
   - au repos : transparente, caméra fermée, rien ne calcule ;
   - pendant un filtre : lit « OBS Virtual Camera » (Type de sortie : Source → WEB CAM),
     applique le filtre et l'affiche par-dessus la cam.
   Sécurités : visage pas vu, plus d'image, image pas en 16:9, erreur → le calque
   s'efface et la cam normale reste à l'antenne.

   Source navigateur : 1920×1080, FPS personnalisé 30 (= VIDEO_FPS), autorisations par défaut.
   https://suunbear.github.io/suunbear-cam/cambureau.html#chat=TA_SESSION
   Options à ajouter après le # :
     &stats        = panneau de mesures (VISIBLE À L'ANTENNE : tests hors live)
     &test=benet   = lance ce filtre 5 s après le chargement (Actualiser la source = relancer)
     &dur=30       = durée du filtre en secondes
     &fps=30 · &det=30 · &scale=0.667 = réglages de charge sans renvoyer le fichier
     &taille=1.5 · &cote=3.1 · &haut=-1.6 · &mains=1 · &marge=1.5 · &detour=1 · &calque=0 · &regard=40 · &corps=0
                   = Paatrice (« derriere ») : taille, écart, hauteur, mains, gommage, détourage, ancienne méthode,
                     angle de tête/corps qui le fait changer de côté, sans suivi du corps
     &paat=0       = sans les têtes de Paatrice des 7 filtres (Chad garde la sienne)
     &joues=1      = Exagéré : sourire diabolique avec les grosses joues (modèle A)
     &brut         = diagnostic (image telle qu'elle arrive, SÉCURITÉS COUPÉES : jamais en live)

   SAMMI, un bouton par filtre :
     1. démarrer la caméra virtuelle · 2. attendre 1500 ms ·
     3. HTTP Request GET https://io.socialstream.ninja/<SESSION>/content/null/{"event":"filtre_bureau","meta":{"nom":"benet"}}
     4. attendre 95000 ms · 5. arrêter la caméra virtuelle
   noms : content · benet · mini · pleure · kawai · exagere · colere · chad · derriere (sans accents)
          Pendant chaque filtre, la tête de Paatrice qui va avec se balade autour de toi (Chad : Paatrice beau gosse).
          Paatrice cam bureau = le farceur : derriere (Stand de temps en temps)
          (anciens noms acceptés : stand · jojo · derriere2 · farceur · bouche → derriere · chat · kawaii → kawai ·
           fache · mad → colere · idee → pleure · yeux → mini · zinzin → benet)
   La cam tel écoute "filtre", la cam bureau "filtre_bureau" : chacune ignore l'autre.

   OBS doit être lancé avec l'option --enable-media-stream.
   ============================================================ */
const CONFIG = {
  VCAM_AUTO        : false, // false = SAMMI allume la caméra virtuelle avant le filtre et l'éteint après.
                            // true  = la page le fait elle-même (source navigateur : « Accès complet à OBS »)
  VCAM_WARMUP      : 0.4,   // (VCAM_AUTO) s d'attente après l'allumage, avant de lire l'image
  VCAM_STOP_DELAY  : 10,    // (VCAM_AUTO) s après le dernier filtre avant d'éteindre
  CAM_LABEL        : 'OBS Virtual Camera',  // nom de la caméra lue (la sortie « Source » d'OBS)
  WIDTH            : 1920,
  HEIGHT           : 1080,
  VIDEO_FPS        : 30,    // images/s du calque (mesuré : 30 = ~+14 pts GPU, 60 = ~+30). Source navigateur au même FPS
  DETECT_FPS       : 30,    // suivis du visage par seconde. À 30 i/s : 30, 15 ou 10 seulement (15 = le filtre traîne)
  RENDER_SCALE     : 1,     // taille de calcul : 1 = 1080p · 0.667 = 720p (mesuré : ne fait gagner que ~3 pts GPU)
  PREDICT          : true,  // prédiction du mouvement entre deux suivis (utile seulement si VIDEO_FPS > DETECT_FPS)
  SMOOTH           : 0.55,  // lissage du suivi (comme la cam tel)
  FACE_HOLD        : 1.5,   // s sans visage avant que le calque s'efface (la cam normale revient)

  FILTERS          : true,
  FILTER_DURATION  : 90,    // secondes par filtre (1 min 30)
  FILTER_STRENGTH  : 1,     // intensité de TOUS les filtres : 0.5 = discret · 1 = normal · 1.5 = très caricatural
  FILTER_LEVELS    : { content:1, derriere:1, mini:1, benet:1, pleure:1, chat:1, chad:1, exagere:1, fache:1 },   // filtre par filtre (chat = Kawai, fache = Colère)
  FILTER_FADE      : 0.5,   // montée / descente de la déformation (s)
  CHAD_SOURCIL     : 'auto',  // Chad : 'auto' = ton sourcil gauche en priorité, l'autre si tu tournes franchement la tête
                              //        · 'droite' = toujours ton sourcil gauche (à droite à l'écran) · 'gauche' = toujours l'autre
  CHAD_TING        : false, // Chad : « ting ✨ » sur son sourire de temps en temps
  BEAU_TAILLE      : 0.2,   // Paatrice beau gosse : hauteur de sa tête (part de la hauteur de l'image), à mi-profondeur
  BEAU_LOIN        : 0.6,   // … × ça quand il est au fond du bureau
  BEAU_PRES        : 1.6,   // … × ça quand il est tout près de la caméra
  BEAU_PROF_TOUR   : 9,     // s pour un aller-retour fond du bureau ↔ caméra
  BEAU_TOUR        : 14,    // s pour un tour complet de son chemin (un 8 couché, régulier)
  BEAU_APPARITION  : 1.4,   // s de fondu à l'apparition
  BEAU_ETOILES     : 2.4,   // s de la pluie d'étoiles multicolores de l'apparition
  CHAD_PAATRICE_ETOILES : 7, // Chad : étoiles qui scintillent EN PERMANENCE autour de la tête de Paatrice beau gosse
                            //        (même style que celles autour de ton visage) · 0 = seulement à l'apparition
  BEAU_FANTOME     : 0.92,  // opacité de sa tête (1 = pleine · 0.8 = plus fantôme)
  CHAD_PAATRICE    : true,  // Chad : la tête de Paatrice beau gosse flotte autour de toi pendant le filtre (jamais devant ton visage)
  FILTER_PAATRICE  : true,  // les 7 autres filtres : la tête de Paatrice qui va avec le filtre se balade autour de toi
                            // (même mouvement que beau gosse dans Chad, sans étoiles) · false = pas de tête
  TETE_TAILLE      : 1,     // taille de ces têtes (1 = même hauteur que la tête beau gosse)
  SOURIRE_JOUES    : false, // Exagéré, sourire diabolique : false = modèle B (choisi) · true = modèle A, grosses joues sur le sourire
  CHAD_ETOILES_COULEUR : 'multi',  // Chad : 'multi' = une couleur par étoile · 'or' = toutes dorées
  CHAD_ETOILES_TAILLE  : 2,        // Chad : taille des étoiles (1 = avant)
  CHAD_ETOILES     : 7,     // Chad : petites étoiles qui scintillent en permanence autour de ton visage (0 = aucune)
  CHAD_FAUX        : false, // Chad : false = TES sourcils déformés (comme le filtre d'origine) · true = gommés et remplacés par des sourcils dessinés
  CHAD_POMPE       : false, // Chad : de temps en temps le sourcil levé fait « pompe-pompe » façon The Rock
  OVERLAY_FADE     : 0.15,  // apparition / disparition du calque (s)
  /* --- Paatrice (nom SAMMI « derriere ») : le farceur, gag Stand de temps en temps --- */
  PAAT_CALQUE      : true,  // true = dessiné seul sur un calque transparent, gommé là où tu es : la vraie cam reste dessous
                            //        en direct (pas de fantôme, moins de GPU) · false = ancienne méthode (image entière recopiée)
  PAAT_DETOURAGE   : true,  // true = il passe DERRIÈRE toi (détourage) · false = à côté, sans détourage
  PAAT_MARGE       : 1.5,   // gommage un peu plus large que toi (cache le retard du détourage quand tu bouges vite) · 0 = pile
  PAAT_TAILLE      : 1.5,   // taille de Paatrice (1 = comme la cam tel) : tu es plus loin de la cam bureau
  PAAT_COTE        : 3.1,   // sa tête : écart sur le côté, en « largeurs d'yeux » (tes yeux, d'un coin à l'autre)
  PAAT_HAUT        : -1.6,  // … et hauteur (négatif = au-dessus de tes yeux)
  PAAT_DOS_X       : 1.2,   // point de ton dos d'où il « sort » (épaule) : écart sur le côté…
  PAAT_DOS_Y       : 2.4,   // … et hauteur sous tes yeux
  PAAT_MAINS       : 1.0,   // taille de ses mains
  PAAT_MAINS_X     : 2.05,  // ses deux mains : écart de chaque côté de ton visage (jamais devant)
  PAAT_MAINS_Y     : 1.15,  // … hauteur du poignet (le doigt monte jusqu'à tes yeux)
  PAAT_AVANTBRAS   : 1.6,   // avant-bras musclé façon Popeye · 1 = comme la cam tel
  PAAT_BRAS        : "tatoue",   // "tatoue" (muscle + soleil sur l'épaule) · "muscle" · "poilu" · "nouille" · "simple"
  PAAT_POILS       : 2,     // poils sur son torse : 1 = poilu · 2 = très poilu
  PAAT_AUTO        : 7,     // s entre deux changements de côté tout seul (± 20 %) — jamais vers là où tu regardes
  PAAT_CORPS       : true,  // suivi du corps (MediaPipe « pose » léger, ~6 Mo, 15 fois/s pendant Paatrice seulement) :
                            // il sait où tu regardes (tête, puis épaules) même de profil, et suit ta tête de profil
  PAAT_REGARD      : 40,    // degrés : ta tête (ou ton corps) tournée au-delà vers un côté → il passe de l'autre côté, dans ton dos
                            // (tête et corps opposés : la tête gagne)
  PAAT_TOURNE      : 0.2,   // sans suivi du corps : tu tournes la tête vers lui de ça (0 → 1 = profil) → il change de côté
  PAAT_LACET       : 1.3,   // tête tournée : décalage du centre de ta tête (mains et Paatrice suivent ta vraie tête)
  PAAT_BLABLA      : 6,     // s de silence max avant qu'il reparle
  PAAT_STAND_1     : 14,    // s avant le 1er Stand (+ 0 à 6 s au hasard) · nom SAMMI « stand » = Stand dès le début
  PAAT_STAND_ECART : 30,    // s entre deux Stands (± 25 %)
  PAAT_STAND_DUREE : 6,     // durée d'un Stand (rafale « PAA PAA PAA » au milieu)
  PAAT_MARIONNETTE : 1,     // taille de la marionnette (tu n'es pas à l'image)
  PAAT_ABSENT      : 1.5,   // s sans toi à l'image → il passe au milieu de l'écran, en marionnette
  PAAT_BODY_MIN    : 0.04,  // part de l'image où le détourage te voit encore (de profil, de dos) → tu es « là »
  PAAT_HOLD        : 8,     // sans détourage seulement : s pendant lesquels tu es « là » après avoir perdu ton visage
  FILTER_QUEUE_MAX : 10,
  FILTER_PRELOAD   : true   // moteur prêt au chargement → 1er filtre immédiat (au repos : aucun calcul)
};
</script>
<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; }
#fx, #fxa { position:fixed; inset:0; width:100%; height:100%; display:block; opacity:0; pointer-events:none; }
#fx.on, #fxa.on { opacity:1; }
#fxa { z-index:2; transition:opacity .25s linear; }   /* Paatrice seul (farceur et marionnette), fond transparent : la vraie cam reste dessous */
#src { position:fixed; left:0; top:0; width:2px; height:2px; opacity:.01; pointer-events:none; }  /* source du moteur, invisible */
#hud { position:fixed; left:14px; top:14px; z-index:5; display:none; padding:9px 12px; border-radius:8px;
       background:rgba(0,0,0,.75); color:#eee; font:600 16px/1.45 Consolas, ui-monospace, monospace; white-space:pre; }
#hud.on { display:block; }
</style>

<body>
<video id="src" muted playsinline autoplay disablepictureinpicture></video>
<canvas id="fx"></canvas>
<canvas id="fxa"></canvas>
<div id="hud"></div>

<script>
(() => {
  const C = CONFIG;
  const frag  = new URLSearchParams(location.hash.slice(1)), query = new URLSearchParams(location.search);
  const has   = k => frag.has(k) || query.has(k);
  const get   = k => (frag.get(k) || query.get(k) || '').trim();
  const SESSION = get('chat');
  const RAW = has('brut');                          // diagnostic : image affichée telle qu'elle arrive (proportions réelles)
  if (+get('dur') > 0)   C.FILTER_DURATION = +get('dur');
  if (+get('fps') > 0)   C.VIDEO_FPS    = +get('fps');                   // tests sans renvoyer le fichier : &fps=30
  if (+get('det') > 0)   C.DETECT_FPS   = +get('det');                   // &det=30
  if (+get('scale') > 0) C.RENDER_SCALE = Math.min(1, +get('scale'));    // &scale=0.667 (calque calculé en 720p)
  if (+get('cote') > 0)  C.PAAT_COTE    = +get('cote');                  // Paatrice : &cote=2.2 (plus sur le côté)
  if (+get('taille') > 0) C.PAAT_TAILLE = +get('taille');                // Paatrice : &taille=1.2 (plus grand)
  if (has('detour'))     C.PAAT_DETOURAGE = get('detour') !== '0';       // Paatrice : &detour=1 (derrière toi, détouré)
  if (has('calque'))     C.PAAT_CALQUE = get('calque') !== '0';          // Paatrice : &calque=0 (ancienne méthode, pour comparer)
  if (has('corps'))      C.PAAT_CORPS = get('corps') !== '0';            // Paatrice : &corps=0 (sans suivi du corps)
  if (+get('regard') > 0) C.PAAT_REGARD = +get('regard');                // Paatrice : &regard=30 (réagit plus tôt quand tu tournes)
  if (get('marge') !== '') C.PAAT_MARGE = +get('marge') || 0;            // Paatrice : &marge=2 (gommage plus large autour de toi)
  if (get('haut') !== '') C.PAAT_HAUT = +get('haut');                    // Paatrice : &haut=-1.8 (sa tête plus haut)
  if (+get('mains') > 0) C.PAAT_MAINS = +get('mains');                   // Paatrice : &mains=1.2 (mains plus grandes)
  if (has('paat'))       C.FILTER_PAATRICE = get('paat') !== '0';        // têtes de Paatrice des 7 filtres : &paat=0 (coupées)
  if (has('joues'))      C.SOURIRE_JOUES = get('joues') !== '0';         // Exagéré : &joues=1 (sourire diabolique avec les grosses joues)

  const $ = s => document.querySelector(s);
  const cv = $('#fx'), vid = $('#src'), hud = $('#hud'), md = navigator.mediaDevices;
  cv.style.transition = 'opacity ' + C.OVERLAY_FADE + 's linear';
  if (RAW) { cv.style.objectFit = 'contain'; cv.style.background = '#5a0a3c'; }   // bandes violettes = zones vides de l'image reçue
  const log = (...a) => console.log('[cambureau]', ...a);
  const ST = { frames:0, dets:0, detMs:0, detMax:0, fps:0, dps:0, avg:0, max:0, cam:'', err:'', ws:false, vcam:null };

  /* ============================================================
     Filtres : définitions, moteur, déformation et dessins repris
     TELS QUELS de camtel.html (validés en live le 30/09/2026).
     ============================================================ */
  const MP_BASE  = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1';   // version figée (empreinte dans l'importmap)
  const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

  /* Déformations : [point du visage, vers le bas, vers le centre, rayon]
     En fractions de l'écart entre les yeux : ça suit la distance au tel.
     « vers le bas » négatif = vers le haut. Indices = carte MediaPipe Face Mesh. */
  const fumeOn = el => el > 1.4 && (el - 1.4) % 3 < .9;   // Fâché : jets de vapeur (et tremblement) toutes les 3 s
  const EYE_R = [33, 133, 159, 145], EYE_L = [263, 362, 386, 374];   // centres des yeux
  const MOUTH = [61, 291, 13, 14], NOSE = [1, 98, 327];
  const FX = {
    content: { name:'😁 Abusément content', stk:'content', bulge:[   // + paillettes dans les yeux
      [EYE_R, .52, .47, .68], [EYE_L, .52, .47, .68]    // yeux globuleux
    ], pts:[
      [61, -.20, -.10, .30], [291, -.20, -.10, .30],    // sourire jusqu'aux oreilles : coins très haut et large
      [40, -.06,   0, .13], [270, -.06,   0, .13],      // lèvre du haut : les côtés remontent
      [91, -.08,   0, .13], [321, -.08,   0, .13],      // lèvre du bas : bouche en U
      [17,  .03,   0, .12],                             // bas du U
      [50, -.07,   0, .18], [280, -.07,   0, .18]       // pommettes remontées
    ]},


    /* --- Façon Snapchat / TikTok : loupes [points (centre = moyenne), largeur, hauteur, force]
       force > 0 = grossit (0.75 ≈ ×4 au centre) · force < 0 = rapetisse --- */
    derriere: { name:'👀 Paatrice farceur', stk:'derriere', seg:true },   // cam bureau : LE Paatrice (farceur, Stand de temps en temps)
    mini: { name:'🤏 Mini', bulge:[                     // l'inverse de Benêt
      [EYE_R, .48, .38, -.86], [EYE_L, .48, .38, -.86], // yeux tout petits
      [MOUTH, .80, .42, -.86]                           // bouche toute petite
    ]},
    benet: { name:'🤪 Benêt', bulge:[
      [EYE_R, .55, .50, .72], [EYE_L, .55, .50, .72],   // gros yeux…
      [MOUTH, .92, .55, .70],                           // … et grande bouche
      [NOSE,  .28, .24, -.30]
    ]},
    pleure: { name:'😢 Pleure', stk:'pleure', pts:[      // gros chagrin + larmes
      [107, -.13, .05, .19], [336, -.13, .05, .19],     // sourcils intérieurs relevés et froncés
      [55,  -.07, .04, .11], [285, -.07, .04, .11],
      [70,   .06,   0, .16], [300,  .06,   0, .16],     // bouts des sourcils qui tombent
      [159,  .04,   0, .08], [386,  .04,   0, .08],     // paupières lourdes
      [33,   .04,   0, .12], [263,  .04,   0, .12],     // yeux tombants
      [61,   .13,   0, .15], [291,  .13,   0, .15],     // bouche en arc triste : les coins tombent…
      [40,   .035,  0, .09], [270,  .035,  0, .09],     // … et toute la lèvre suit la courbe (épaisseur naturelle)
      [91,   .045,  0, .09], [321,  .045,  0, .09],
      [17,  -.03,   0, .10],                            // lèvre du bas qui boude un peu
      [152, -.04,   0, .20]                             // menton qui se plisse
    ], anim:el => {                                     // la lèvre du bas tremble par moments (sanglots)
      const q = .014 * Math.max(0, Math.sin(el * 1.6)) * Math.sin(el * 44);
      return [[17, q, 0, .09], [14, q * .7, 0, .07]];
    }},
    chad: { name:'🗿 Chad', pts:[                        // mâchoire de gigachad + air sûr de lui
      [152,  .36,    0, .40, 0, .30],                           // menton bien allongé (sans tirer la lèvre du bas)
      [176,  .16, -.15, .30, 0, .20], [400,  .16, -.15, .30, 0, .20],   // menton large et carré
      [136,  .09, -.12, .24], [365,  .09, -.12, .24],   // mâchoire élargie, anguleuse
      [172,  .02, -.10, .22], [397,  .02, -.10, .22],
      [61,  -.21, -.14, .27, 1], [291, -.18, -.13, .26, 1],   // sourire chad : les deux coins bien relevés et la bouche élargie (un poil plus côté sourcil levé)
      [50,  -.07,    0, .17], [280, -.07,    0, .17],     // les joues remontent avec le sourire
      [105, -.20,    0, .24, 1], [70, -.12, 0, .20, 1], [107, -.07, 0, .16, 1],   // un sourcil levé haut, en entier (l'œil ne bouge pas, pas de pli)
      [334,  .06,  .03, .15, 1], [296, .06, .04, .12, 1], [300, .04, 0, .13, 1],  // l'autre bas et lourd
      [159,  .035,   0, .08, 1], [386, .045,  0, .08, 1],     // yeux plissés (comme la cam tel)     // yeux plissés
      [145, -.02,    0, .07], [374, -.02,  0, .07],
      [116, -.03, -.02, .12], [345, -.03, -.02, .12]    // pommettes marquées
    ], stk:'chad', side:true },                         // = Chad de la cam tel · + étoiles (CHAD_ETOILES) · + sourcil levé qui change de côté (marqués 1)
    fache: { name:'😠 Colère', stk:'fache', pts:[      // la colère qui bout : regard noir rouge, visage qui rougit, vapeur…
      [107,  .15,  .09, .20], [336,  .15,  .09, .20],   // bouts intérieurs des sourcils : très bas et serrés
      [105,  .06,  .03, .16], [334,  .06,  .03, .16],
      [70,  -.06,    0, .16], [300, -.06,    0, .16],   // bouts extérieurs qui remontent → V
      [157,  .06,    0, .09], [384,  .06,    0, .09],   // yeux en fente, en biais : regard noir
      [160,  .03,    0, .08], [387,  .03,    0, .08],
      [145, -.04,    0, .09], [374, -.04,    0, .09],
      // bouche de colère (lèvres serrées et pincées, coins tirés vers le bas en arc, menton qui remonte)
      [61,   .15,  .02, .12], [291,  .15,  .02, .12],
      [40,   .05,    0, .09], [270,  .05,    0, .09], [91,  .06, 0, .09], [321, .06, 0, .09],
      [0,    .025,   0, .08], [17,  -.045,   0, .10],
      [152, -.06,    0, .20],
      [98,     0, -.03, .07], [327,    0, -.03, .07]    // narines qui se gonflent
    ], anim:el => {                                     // ça tremble de rage quand la vapeur sort
      if (!fumeOn(el)) return [];
      return [[1, .011 * Math.sin(el * 91), .011 * Math.sin(el * 67 + 1), 1.5]];
    }},
    /* 🤯 Exagéré : tête gonflée + TES expressions exagérées en direct (bouche ouverte → énorme, sourire → jusqu'aux oreilles…) */
    exagere: { name:'🤯 Exagéré', dyn:true, bulge:[
      [[1, 4, 6], 1.3, 1.6, .14]                          // tête un peu gonflée (une seule loupe : pas de plis)
    ]},

  /* Paatrice dessinée dans le repère courant (0..512), regard (look : -1 gauche · 0 face · 1 droite) + clignement */

  const paatScene = (g, P, a, el, dt, v, W, H, erase) => {

    const gy = fx.guy || (fx.guy = { side:0, to:0, x:0, y:0, ang:0, look:0, init:false, want:0, wantT:0, sw:0, pop:1, auto:0, autoT:7, why:'dos',
                                     U:0, ratio:0, yaw:.5, yawF:-1, yawB:-1, c0:0, st:-1, nextStand:null, bub:null, bubEnd:0, said0:false, rushSaid:false });
    const kf = 1 - Math.exp(-dt * 6);                      // il suit tes mouvements avec un petit temps de retard
    /* --- ton orientation (lacet : 0,5 = de face) et ta taille, stables même de profil --- */
    const Lc = fx.sm[234], Rc = fx.sm[454], Nz = fx.sm[1], Tp = fx.sm[10], Ch = fx.sm[152];
    const fresh = fx.miss < 3;
    if (fresh && Lc && Rc && Nz) {
      const w = (Rc[0] - Lc[0]) * rx + (Rc[1] - Lc[1]) * ry;
      if (w > 1) gy.yaw = Math.max(-.2, Math.min(1.2, ((Nz[0] - Lc[0]) * rx + (Nz[1] - Lc[1]) * ry) / w));
      if (gy.yawF < -.5) gy.yawF = gy.yawB = gy.yaw;
      gy.yawF += (gy.yaw - gy.yawF) * (1 - Math.exp(-dt / .08));   // suit vite…
      gy.yawB += (gy.yaw - gy.yawB) * (1 - Math.exp(-dt / 1.5));   // … ta position habituelle, lentement
    }
    let U = fw;                                            // écart des yeux… qui rétrécit quand tu tournes la tête : corrigé par la hauteur du visage
    if (Tp && Ch) {
      const fh = Math.hypot(Ch[0] - Tp[0], Ch[1] - Tp[1]);
      if (fresh && Math.abs(gy.yaw - .5) < .08) gy.ratio = gy.ratio ? gy.ratio + (fh / fw - gy.ratio) * .05 : fh / fw;
      U = Math.max(fw, fh / Math.max(1.6, Math.min(2.4, gy.ratio || PAAT_RATIO)));
    }
    gy.U = gy.U ? gy.U + (U - gy.U) * (1 - Math.exp(-dt * 2.5)) : U;
    U = gy.U;
    const yawC = Math.max(0, Math.min(1, gy.yaw));
    gy.c0 += ((.5 - yawC) * C.PAAT_LACET - gy.c0) * kf;  // tête tournée : le centre de ta tête n'est plus entre tes yeux
    const G = (u, w) => [mx + (rx * (u + gy.c0) + dx * w) * U, my + (ry * (u + gy.c0) + dy * w) * U];   // repère de TON visage
    const ta = Math.min(1, Math.abs(yawC - .5) * 2) * .45;   // tête tournée : ton nez et l'arrière de ta tête dépassent → on élargit
    const MX = C.PAAT_MAINS_X + ta, PF = PAAT_FACE, fx0 = PF[0] + ta;
    const face = rectOf([G(-fx0, PF[1]), G(fx0, PF[1]), G(-fx0, PF[2]), G(fx0, PF[2])]);
    face[4] = 4;

    /* --- gag Stand : de temps en temps, quelques secondes --- */
    const D = Math.max(3, C.FILTER_DURATION), SD = C.PAAT_STAND_DUREE;
    if (gy.nextStand == null) gy.nextStand = FX[fx.key].standFirst ? 2.2 : C.PAAT_STAND_1 + Math.random() * 6;
    if (gy.st < 0 && !gy.sw && el > gy.nextStand && el < D - SD - 1.5) {
      gy.st = el; gy.rushSaid = false; gy.nextStand = el + C.PAAT_STAND_ECART * (.75 + Math.random() * .5);
      gy.bub = { txt:pick('stand'), t0:el, dur:2.2 };
    }
    const se = gy.st >= 0 ? el - gy.st : -1;
    if (se > SD) gy.st = -1;
    const sk = gy.st < 0 ? 0 : Math.max(0, Math.min(1, se / .35, (SD - se) / .5));   // 0 → 1 → 0
    const rushing = gy.st >= 0 && se > 2 && se < SD - 1.2;
    if (rushing && !gy.rushSaid) { gy.rushSaid = true; gy.bub = { txt:RUSH_TXT, t0:el, dur:SD - 1.2 - se }; }

    /* --- de quel côté ? --- */
    const TAI = C.PAAT_TAILLE * (1 + .15 * sk);
    let R = 1.1 * U * TAI; const shrink = Math.min(1, H * .2 / R); R *= shrink;   // jamais énorme si tu es tout près
    const COTE = C.PAAT_COTE, HAUT = C.PAAT_HAUT - .45 * sk;
    const fits = s => { const p = G(s * (COTE + .6), HAUT); return p[0] > R * .85 && p[0] < W - R * .85; };   // ce côté a assez de place ? (sa tête + l'écart pour ta main)
    /* tu tournes la tête vers lui → il passe de l'autre côté. On regarde le MOUVEMENT de ta tête
       (par rapport à ta position habituelle) : à la cam bureau tu es souvent tourné vers l'écran. */
    /* Suivi du corps : tête (oreilles) d'abord, sinon épaules — même de profil. Tête et corps opposés : la tête gagne.
       Tu regardes vers la droite → il passe à gauche (dans ton dos). Sans suivi du corps : le mouvement de ton visage. */
    const O = fx.ori && fx.now - fx.ori.t < 500 ? fx.ori : null;
    let gaze = 0;                                          // +1 = tu regardes vers la droite de l'image · -1 = la gauche · 0 = de face
    if (O) {
      const TH = C.PAAT_REGARD, g0 = gy.gaze || 0;
      const dir = a => a == null ? 0 : (a * g0 > 0 && Math.abs(a) > TH * .75) ? g0 : a > TH ? 1 : a < -TH ? -1 : 0;   // un peu d'hystérésis
      const hs = dir(O.head), bs = dir(O.body);
      gaze = hs || (O.head != null && Math.abs(O.head) > TH * .5 && Math.sign(O.head) === -bs ? 0 : bs);
    } else {
      const dy0 = gy.yawF - gy.yawB;
      gaze = dy0 > C.PAAT_TOURNE ? 1 : dy0 < -C.PAAT_TOURNE ? -1 : 0;
    }
    gy.gaze = gaze;
    const turn = -gaze * Math.sign(rx || 1);               // côté où il doit être, dans le repère de ton visage
    if (!gy.side) {
      gy.side = gy.to = mx < W / 2 ? 1 : -1;               // du côté où il y a de la place
      if (!fits(gy.side) && fits(-gy.side)) gy.side = gy.to = -gy.side;
      gy.autoT = C.PAAT_AUTO * (.8 + Math.random() * .4);
    }
    if (!gy.sw) {
      gy.auto += dt;
      if (!fits(gy.side) && fits(-gy.side)) { gy.to = -gy.side; gy.sw = 1; gy.why = 'dos'; }        // il sortirait de l'image → autre côté
      else if (sk === 0 && el > 2.5 && gy.auto > .8 && turn && turn !== gy.side && fits(turn)) {    // tu regardes de son côté
        if (gy.want !== turn) { gy.want = turn; gy.wantT = 0; }
        gy.wantT += dt;
        if (gy.wantT > .2) { gy.to = turn; gy.sw = 1; gy.want = 0; gy.why = 'tourne'; }
      } else {
        gy.want = 0;
        if (gy.st < 0 && el > 2.5 && gy.auto > gy.autoT && fits(-gy.side) && !(turn && turn === gy.side)) { gy.to = -gy.side; gy.sw = 1; gy.why = 'dos'; }   // farceur : il te tourne autour (jamais vers là où tu regardes)
      }
    }
    if (gy.sw === 1) {                                     // changement net : il rétrécit vite…
      gy.pop = Math.max(0, gy.pop - dt / .12);
      if (gy.pop <= 0) {
        gy.side = gy.to; gy.init = false; gy.sw = 2; gy.auto = 0; gy.autoT = C.PAAT_AUTO * (.8 + Math.random() * .4);
        gy.yawB = gy.yawF;                                 // nouvelle position de référence : pas de va-et-vient
        if (gy.st < 0) gy.bub = { txt:pick(gy.why === 'tourne' ? 'tourne' : 'dos'), t0:el, dur:3 };
      }
    } else if (gy.sw === 2) {                              // … et rebondit de l'autre côté
      gy.pop = Math.min(1, gy.pop + dt / .25);
      if (gy.pop >= 1) gy.sw = 0;
    }
    const ps = gy.sw === 2 ? backOut(gy.pop) : gy.pop;     // sa taille pendant le changement
    const sd = gy.side;

    /* --- position : sa tête à côté de la tienne, plus haut ; son torse penché rentre dans ton dos --- */
    const T = G(sd * COTE, HAUT + .1 * sk * Math.sin(el * 1.6));   // (le Stand flotte)
    const inImg = () => { T[0] = Math.max(R * 1.02, Math.min(W - R * 1.02, T[0])); T[1] = Math.max(R * 1.02, Math.min(H - R * 1.02, T[1])); };
    inImg();                                               // sa tête reste toujours entière dans l'image
    {                                                      // … et ne passe jamais derrière sa propre main (ta tête trop haute dans l'image, etc.)
      const hr = handRect([G(sd * MX, C.PAAT_MAINS_Y), C.PAAT_MAINS * U * TAI * shrink]), mg = R * .06;
      const hit = () => { const cx = Math.max(hr[0] - mg, Math.min(hr[2] + mg, T[0])), cy = Math.max(hr[1] - mg, Math.min(hr[3] + mg, T[1])); return Math.hypot(T[0] - cx, T[1] - cy) < R; };
      for (let i = 0; i < 16 && hit(); i++) { T[0] += sd * rx * R * .1; T[1] += sd * ry * R * .1; inImg(); }   // il s'écarte sur le côté
    }
    if (!gy.init) { gy.x = T[0]; gy.y = T[1]; gy.ang = roll; gy.init = true; }
    gy.x += (T[0] - gy.x) * kf; gy.y += (T[1] - gy.y) * kf;
    const up = Math.min(backOut(el / .9), a);              // il sort de ton dos à l'arrivée… et y rentre à la fin
    const A0 = G(sd * C.PAAT_DOS_X, C.PAAT_DOS_Y);         // le point de ton dos d'où il sort
    const hx = A0[0] + (gy.x - A0[0]) * up, hy = A0[1] + (gy.y - A0[1]) * up + .02 * U * Math.sin(el * 2.4);
    const k = 2.2 * U * TAI * shrink * Math.max(.02, ps) * (.4 + .6 * up) / 512;
    const vx = A0[0] - hx, vy = A0[1] - hy, Lb = Math.hypot(vx, vy) || 1;
    let dA = Math.atan2(-vx, vy) - roll; dA = Math.atan2(Math.sin(dA), Math.cos(dA));
    const lean = roll + Math.max(-.9, Math.min(.9, dA)), tgt = lean + (roll * .5 + .05 * Math.sin(el * 1.1) - lean) * sk;   // le Stand se redresse
    const stretch = 1 + (Math.max(.8, Math.min(1.6, (Lb + .5 * U - 224 * k) / (620 * k))) - 1) * (1 - sk);
    gy.ang += (tgt - gy.ang) * kf;
    const lookT = sk > .5 ? 0 : (el % 5.2) < 3.8 ? -sd : 0;   // regard en coin vers toi… puis vers la caméra
    gy.look += (lookT - gy.look) * (1 - Math.exp(-dt * 7));
    const bt = (el + .7) % 3.4, blink = bt < .16 ? Math.sin(bt / .16 * Math.PI) : 0;   // clignement

    let L2G = null;
    if (ps > .02) {
      /* corps + tête (Stand : aura violette, bas du torse qui s'efface) */
      g.save();
      if (sk > .01) { g.shadowColor = 'rgba(164,92,255,.95)'; g.shadowBlur = R * (.45 + .2 * Math.sin(el * 5)) * sk; g.globalAlpha = 1 - .1 * sk; }
      L2G = paatFigure(g, S, hx, hy, gy.ang, k, gy.look, blink, stretch, sk > .5 ? 'stand' : 'soft');
      g.restore();
    }
    /* deux bras : un doigt de chaque côté de ton visage (le 2e bras passe derrière toi, ressort derrière ton autre épaule) */
    const hands = [];
    gy.armK = gy.sw ? 0 : Math.min(1, (gy.armK || 0) + dt / .35);   // après un changement de côté, il relève les bras
    const ap = (el < 1 ? 0 : backOut((el - 1) / .4)) * Math.min(1, a * 2) * up * backOut(gy.armK);
    if (L2G && ap > .01) {
      const hh0 = C.PAAT_MAINS * U * TAI * shrink;
      for (const s of [-sd, sd]) {                         // s = côté de ton visage où va la main (d'abord celle qui passe derrière toi)
        const near = s === sd, ph = near ? 0 : 1.4;
        const pump = .12 * Math.abs(Math.sin(el * 3.4 + ph)) * (1 + sk);   // il te les « pousse » en rythme
        const Wt = G(s * MX, C.PAAT_MAINS_Y - pump);
        let S0, R0, E = null;
        if (near) { S0 = L2G(256 + sd * 230, 600); R0 = L2G(256 + sd * 120, 760); }          // son épaule extérieure
        else { S0 = L2G(256 - sd * 230, 600); E = G(-sd * 1.55, 3); R0 = G(-sd * 1.6, 2.5); }   // épaule côté toi → derrière ton autre épaule
        const W0 = [R0[0] + (Wt[0] - R0[0]) * ap, R0[1] + (Wt[1] - R0[1]) * ap];
        const Lseg = 1.15 * k * 512 / 2.2;                 // longueur bras / avant-bras : jamais de bras démesuré
        if (near) {
          E = elbowIK(S0, W0, Lseg, Lseg, [dx + sd * rx * .6, dy + sd * ry * .6]);   // coude vers le bas, vers l'extérieur
          paatArm(g, S0, W0, k, [dx, dy], C.PAAT_BRAS, el, false, { elbow:E, tat:true });
        } else {                                           // il passe par ton dos (caché par toi), puis ressort derrière ton autre épaule
          const B = G(-sd * .2, 2.6);
          paatArm(g, S0, B, k, [dx, dy], 'muscle', el, false, { elbow:B });
          paatArm(g, B, W0, k, [dx, dy], 'muscle', el, false, { elbow:E });
        }
        hands.push([W0, hh0 * (.4 + .6 * ap) * ps, roll + s * .14 + .06 * Math.sin(el * 6.8 + ph), s > 0, Math.min(1, ap * 3)]);
      }
    }
    if (L2G && sk > .01) menacing(g, hx, hy + R * .6, R * .75, el, sk * up);   // ゴゴゴ (derrière toi aussi)
    /* toi devant lui : on gomme Paatrice là où le détourage te voit (ou, ancienne méthode, toi détouré par-dessus) */
    if (fx.mask) {
      if (erase) {
        g.save(); g.globalCompositeOperation = 'destination-out';
        g.drawImage(C.PAAT_MARGE > 0 ? segMaskD : segMask, 0, 0, W, H); g.restore();
      } else g.drawImage(personLayer(v, W, H), 0, 0);
    }
    for (const h of hands) paatHand(g, ...h);              // ses mains : à côté de ton visage, par-dessus tout
    const fc = G(0, 0);
    if (rushing) for (const h of hands) rushAround(g, h, el, face, fc, Math.min(1, sk * 2));
    if (!L2G) return;
    /* bulles : à l'arrivée, à chaque changement de côté, au Stand… et s'il se tait depuis trop longtemps */
    if (!gy.said0 && el > 1.2) { gy.said0 = true; if (!gy.bub) gy.bub = { txt:pick('arrivee'), t0:el, dur:3 }; }
    if (gy.bub && el - gy.bub.t0 > gy.bub.dur) { gy.bub = null; gy.bubEnd = el; }
    if (!gy.bub && gy.said0 && !gy.sw && gy.st < 0 && el - gy.bubEnd > C.PAAT_BLABLA) gy.bub = { txt:pick('dos'), t0:el, dur:3 };
    const avoid = [face].concat(hands.map(handRect));
    const bub = gy.bub ? paatSay(g, gy.bub, el, L2G, hx, hy, R, sd, avoid, W, H, up * ps) : null;
    if (sk > .01 && se < 2.6) {                            // carte « STAND 「PAATRICE」 » au début du Stand
      const cs = R * .34, m = standCardSize(g, cs);
      const ox = sd > 0 ? hx + R * .95 : hx - R * .95 - m.w;   // côté extérieur
      const cands = [[hx - m.w / 2, hy - R * 1.08 - m.h], [ox, hy - R * .55 - m.h / 2], [ox, hy - R - m.h * .3], [ox, hy + R * .9], [hx - m.w / 2, hy + R * 1.05]];
      if (bub) bub[4] = 4;
      const [x, y] = placeBox(m.w, m.h, cands, avoid.concat([bub, [hx - R * .85, hy - R * .9, hx + R * .85, hy + R * .9, 3]]), W, H);
      standCard(g, x, y, cs, Math.min(1, se / .5, (2.6 - se) / .5) * sk);
    }
  };

  /* Tu n'es pas à l'image : Paatrice seul, au milieu, coupé au bassin par le bas de l'écran (comme une marionnette),
     DEUX doigts d'honneur vers la caméra, tatouage bien visible. Calque transparent : la vraie cam reste dessous. */
  const paatPuppet = (g, W, H, t, dt, a) => {
    const S = sprites(), pp = fx.pup || (fx.pup = { t0:t, bub:null, n:0 });
    const el = (t - pp.t0) / 1000;
    const k = .8 * H / 1000 * C.PAAT_MARIONNETTE, R = 238 * k;
    const up = Math.min(backOut(el / .6), a);              // il monte du bas de l'écran (et redescend à la fin)
    const sway = .03 * Math.sin(el * 1.6);                 // petit balancement de marionnette
    const hx = W / 2, hy = H - (1040 - 256) * k + (1 - up) * H * .9;   // bassin pile au bas de l'écran
    const bt = (el + .3) % 3.1, blink = bt < .16 ? Math.sin(bt / .16 * Math.PI) : 0;
    const L2G = paatFigure(g, S, hx, hy, sway, k, 0, blink, 1, false);
    const ap = up * backOut(Math.min(1, Math.max(0, (el - .5) / .4)));
    const hands = [];
    if (ap > .01) for (const s of [-1, 1]) {               // deux bras levés, un doigt de chaque côté de sa tête
      const ph = s > 0 ? 0 : 1.3, pump = .05 * Math.abs(Math.sin(el * 3.4 + ph));
      const S0 = L2G(256 + s * 230, 600), Wt = L2G(256 + s * 500, 330 - pump * 300), R0 = L2G(256 + s * 150, 760);
      const E = L2G(256 + s * (300 + 150 * ap), 800 + 60 * ap);   // coude bien écarté : l'avant-bras ne cache pas l'épaule
      const W0 = [R0[0] + (Wt[0] - R0[0]) * ap, R0[1] + (Wt[1] - R0[1]) * ap];
      paatArm(g, S0, W0, k, [-Math.sin(sway), Math.cos(sway)], C.PAAT_BRAS, el, false, { elbow:E, tat:s > 0, tatZ:1.3 });
      hands.push([W0, 300 * k * (.4 + .6 * ap), sway + s * .1 + .06 * Math.sin(el * 6.8 + ph), s > 0, Math.min(1, ap * 3)]);
    }
    for (const h of hands) paatHand(g, ...h);
    /* il commente ton absence, à côté de sa tête (une fois à gauche, une fois à droite) */
    const lt = el - .8 - pp.n * 4.2;
    if (lt > 4.2) pp.n++;
    if (lt > 0 && lt < 3.6) {
      if (!pp.bub || pp.bub.n !== pp.n) pp.bub = { n:pp.n, txt:pick('absent'), t0:el, dur:3.6 };
      paatSay(g, pp.bub, el, L2G, hx, hy, R, pp.n % 2 ? 1 : -1, hands.map(handRect), W, H, up);
    }
  };

  /* --- Chad : gommer tes traits (la peau ou la barbe d'à côté recopiée par-dessus, bords fondus) et dessiner ceux du meme --- */
  const ERA = { c:document.createElement('canvas'), m:document.createElement('canvas') };
  const eraseZone = (g, poly, ox, oy, blur) => {           // poly = zone à gommer · (ox, oy) = où on prend la peau
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const [x, y] of poly) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    const pad = Math.ceil(blur * 2.5) + 2; x0 = Math.floor(x0 - pad); y0 = Math.floor(y0 - pad);
    const w = Math.ceil(x1 + pad) - x0, h = Math.ceil(y1 + pad) - y0, W = g.canvas.width, H = g.canvas.height;
    if (!(w > 2 && h > 2 && w < 1200 && h < 1200) || x0 + ox < 0 || y0 + oy < 0 || x0 + ox + w > W || y0 + oy + h > H) return;
    const { c, m } = ERA;
    if (c.width < w || c.height < h) { c.width = m.width = Math.max(c.width, w); c.height = m.height = Math.max(c.height, h); }
    const cg = c.getContext('2d'), mg = m.getContext('2d');
    mg.clearRect(0, 0, m.width, m.height); mg.filter = 'blur(' + Math.max(.5, blur).toFixed(1) + 'px)'; mg.fillStyle = '#000';
    mg.beginPath(); poly.forEach(([x, y], i) => i ? mg.lineTo(x - x0, y - y0) : mg.moveTo(x - x0, y - y0)); mg.closePath(); mg.fill();
    mg.filter = 'none';
    cg.globalCompositeOperation = 'copy'; cg.drawImage(g.canvas, x0 + ox, y0 + oy, w, h, 0, 0, w, h);
    cg.globalCompositeOperation = 'destination-in'; cg.drawImage(m, 0, 0, w, h, 0, 0, w, h);
    cg.globalCompositeOperation = 'source-over';
    g.drawImage(c, 0, 0, w, h, x0, y0, w, h);
  };
  const seeded = s => () => (s = (s * 16807) % 2147483647) / 2147483647;
  /* faux sourcil du meme, version réaliste (proportions d'un sourcil d'homme) :
     départ au-dessus du coin intérieur de l'œil, point haut aux 2/3 de la longueur, queue un peu plus haute que le départ ;
     droit, dense, plus épais côté nez, effilé vers la tempe ; fait de poils (pas d'aplat), couleur de tes cheveux.
     I = bout côté nez, O = bout côté tempe, up = « vers le haut », r = 0 (bas, plat, froncé) → 1 (« People's Eyebrow » : levé, arqué aux 2/3) */
  const fakeBrow = (g, I, O, up, fw, r, alpha, seed) => {
    const ax = O[0] - I[0], ay = O[1] - I[1], L = Math.hypot(ax, ay) || 1, ux = ax / L, uy = ay / L;
    const pk = .62;                                                     // point haut : vers les 2/3
    const hLow = t => -.05 + .06 * t;                                   // baissé : bas, lourd, la tête qui plonge vers le nez (regard dur)
    const hHi = t => t < pk ? .05 + .29 * Math.pow(t / pk, .85) : .34 - .2 * Math.pow((t - pk) / (1 - pk), 1.1);   // levé : très haut, en pointe aux 2/3 (photos)
    const Hh = t => hLow(t) + (hHi(t) - hLow(t)) * r;
    const Th = t => (t < .12 ? .12 + .25 * t : .15) * (t > .6 ? 1 - .65 * (t - .6) / .4 : 1);   // tête épaisse (≈ 0,1 écart d'yeux), queue fine
    const P = (t, h) => [I[0] + ax * t + up[0] * h * fw, I[1] + ay * t + up[1] * h * fw];
    g.save(); g.globalAlpha = alpha * .6;                               // fond léger, bords fondus : la peau passe un peu à travers

  const T_SPR = {};
  const tHalo = head => mk(head.width, head.height, g => {
    g.filter = 'blur(24px) brightness(0) invert(1)'; g.globalAlpha = .5; g.drawImage(head, 0, 0);
    g.filter = 'none'; g.globalAlpha = 1; g.drawImage(head, 0, 0);
  });
  const teteSprite = (key, i) => {
    const id = key + (i || 0);
    return T_SPR[id] || (T_SPR[id] = (() => {
      const S = sprites(), D = 512 + 2 * T_PAD, f = Array.isArray(T_HEADS[key]) ? T_HEADS[key][i || 0] : T_HEADS[key];
      return tHalo(mk(D, D, g => { g.translate(T_PAD, T_PAD); f(g, S); }));
    })());
  };

     Chaque morceau est préparé à 8 tailles (normal → aperçu → encore plus petit) ; entre deux tailles,
     les deux dessins voisins sont posés à la même taille et passent de l'un à l'autre en fondu. */

    const L3 = (a, b, c) => u <= .75 ? a + (b - a) * m : b + (c - b) * v;
    const G3 = (a, b, c) => u <= .75 ? a * Math.pow(b / a, m) : b * Math.pow(c / b, v);
    return { m, r:G3(70, 21, 15), w:L3(12, 7, 6), ex:L3(109, 60, 50), ey:L3(250, 248, 250),
             bs:G3(1, .63, .5), bw:24 * G3(1, .75, .65), bx:L3(18, -9, -9), by:L3(135, 60, 46),
             W:G3(144, 14, 10), mx:L3(256, 258, 258), my:L3(396, 352, 350) };

  /* ============================================================
     Caméra virtuelle, démarrage / fin, déclencheur, panneau
     ============================================================ */
  const CAM_RE = new RegExp(C.CAM_LABEL.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
  const camMsg = e => !e ? 'erreur'
    : e.name === 'NotAllowedError'      ? 'accès refusé (OBS lancé sans --enable-media-stream ?)'
    : e.name === 'NotReadableError'     ? 'caméra virtuelle occupée ou pas démarrée'
    : e.name === 'OverconstrainedError' ? 'caméra virtuelle introuvable'
    : (e.message || e.name);
  const findCam = async () => {
    if (!md || !md.getUserMedia) throw new Error('pas d\'accès caméra (--enable-media-stream ?)');
    const list = async () => (await md.enumerateDevices()).filter(d => d.kind === 'videoinput');
    let cams = await list(), hit = cams.find(d => CAM_RE.test(d.label));
    ST.devs = cams.map(d => d.label || '?').join(' | ');
    if (hit) return hit.deviceId;
    if (!cams.some(d => d.label)) {                  // noms cachés : on les débloque par le micro (ne touche jamais à l'Elgato)
      try { const s = await md.getUserMedia({ audio:true }); s.getTracks().forEach(tr => tr.stop()); } catch (_) {}
      cams = await list(); hit = cams.find(d => CAM_RE.test(d.label));
      if (hit) return hit.deviceId;
    }
    throw new Error(cams.some(d => d.label)
      ? 'caméra virtuelle introuvable. Vues : ' + cams.map(d => d.label || '?').join(', ')
      : 'noms des caméras cachés (--enable-media-stream ?)');
  };

  const vcamStatus = () => new Promise(r => {
    if (!OBS || !OBS.getStatus) return r(null);
    setTimeout(() => r(null), 1000);
    try { OBS.getStatus(s => r(!!(s && s.virtualcam))); } catch (_) { r(null); }
  });
  let vcamOurs = false, vcamStopT = 0;
  const flag = on => { try { on ? localStorage.setItem(VKEY, '1') : localStorage.removeItem(VKEY); } catch (_) {} };
  const vcamOn = async () => {
    clearTimeout(vcamStopT);
    if (!vcamCan() || await vcamStatus()) return;    // pas d'accès, ou déjà allumée
    OBS.startVirtualcam(); vcamOurs = true; flag(true);
    for (let i = 0; i < 25 && !(await vcamStatus()); i++) await sleep(120);   // ≈ 0,3 à 1 s
    if (!(await vcamStatus())) throw new Error('la caméra virtuelle ne démarre pas');
    await sleep(C.VCAM_WARMUP * 1000);
  };
  const vcamOff = now => {
    clearTimeout(vcamStopT);
    if (!vcamOurs) return;
    const off = () => { if (fx.on || fxQ.length) return; try { OBS.stopVirtualcam(); } catch (_) {} vcamOurs = false; flag(false); };
    if (now) off(); else vcamStopT = setTimeout(off, C.VCAM_STOP_DELAY * 1000);
  };
  addEventListener('beforeunload', () => { if (vcamOurs) { try { OBS.stopVirtualcam(); } catch (_) {} flag(false); } });
  try {                                              // la page s'était fermée en plein filtre → on éteint ce qu'elle avait allumé
    if (vcamCan() && localStorage.getItem(VKEY) === '1') { OBS.stopVirtualcam(); flag(false); }
  } catch (_) {}

  /* Ouvre la caméra virtuelle dans son format d'origine (sans recadrage du navigateur).
     ⚠️ Le navigateur annonce la caméra virtuelle d'OBS « à l'envers » (1080×1920) alors que les images
     arrivent bien en 1920×1080 : on ne se fie donc qu'à la taille réelle des images (vérifiée à chaque image). */
  const ratioOK = (w, h) => w && h && Math.abs(w / h - C.WIDTH / C.HEIGHT) < 0.02;
  const openCam = id => md.getUserMedia({ video:{ deviceId:{ exact:id }, width:{ ideal:C.WIDTH }, height:{ ideal:C.HEIGHT },
                                                  frameRate:{ ideal:C.VIDEO_FPS }, resizeMode:{ ideal:'none' } } });

  const fxStart = async key => {
    if (fx.on) return;
    Object.assign(fx, { on:true, ending:false, key, t0:0, face:0, seen:0, miss:0, sm:{}, bs:{}, fg:1, parts:[], guy:null,
                        pup:null, body:null, refBody:null, lastPresent:0, pstate:'', ori:null, refHead:null, nPose:0,
                        beau:null, mir:null, mirT:null, mirK:1, mirHold:0, ting:null, tw:null, cYaw:null, turnA:0, farR:false,
                        mask:false, last:0, tDet:0, lastFrame:performance.now(), useRaf:false, got:false, q:-1 });
    segPrev = null; segImg = null;
    ST.err = '';
    try {
      if (FX[key].ghost) {                           // Paatrice beau gosse : il flotte sur un calque transparent, sans ouvrir
        glInit(); sprites(); beauSprite();           // la caméra virtuelle ni le moteur de suivi (marche même s'ils sont éteints)
        fx.useRaf = true; fx.got = true;
        const first = new Promise(r => { fx.drawn = r; });
        sched(); await first;
        if (!fx.on) return;
        fx.t0 = performance.now(); log('filtre', key, 'lancé (sans caméra)'); return;
      }
      await ensureLM();
      if (FX[key].seg && C.PAAT_DETOURAGE) await ensureSeg().catch(() => {});
      if (FX[key].keep && C.PAAT_CORPS) await ensureBody().catch(e => log('suivi du corps indisponible : ' + (e.message || e)));
      glInit();
      if (FX[key].stk) sprites();                    // dessins préparés AVANT le compte à rebours
      if (FX[key].stk === 'chad' && C.CHAD_PAATRICE) beauSprite();
      if (C.FILTER_PAATRICE && TETE_KEYS.has(key)) { sprites(); tetePrep(key); }   // tête de Paatrice du filtre
      await vcamOn();
      const id = await findCam();
      const s = await openCam(id);
      const tr = s.getVideoTracks()[0];
      if (!fx.on) { tr.stop(); return; }
      fx.track = tr; ST.cam = tr.label;
      try { const c = tr.getCapabilities(); ST.caps = (c.width && c.width.max) + '×' + (c.height && c.height.max); } catch (_) {}
      tr.addEventListener('ended', () => { ST.err = 'caméra virtuelle coupée'; fxEnd(true); });
      vid.srcObject = s;
      await vid.play();
      const first = new Promise((r, j) => { fx.drawn = r; setTimeout(() => j(new Error('pas d\'image de la caméra virtuelle')), 4000); });
      sched();
      setTimeout(() => {                             // images jamais signalées → mode secours
        if (fx.on && !fx.got) { try { vid.cancelVideoFrameCallback(fx.rvfc); } catch (_) {} fx.useRaf = true; sched(); }
      }, 700);
      await first;
      if (!fx.on) return;
      fx.t0 = performance.now();                     // le compte à rebours part maintenant
      log('filtre', key, 'lancé ·', tr.label, JSON.stringify(tr.getSettings()));
    } catch (e) {
      if (fx.on) { ST.err = camMsg(e); log('échec :', ST.err); await fxEnd(true); }
    }
  };
  const fxEnd = async failed => {
    if (!fx.on || fx.ending) return;
    fx.ending = true;
    const shown = fxCv.classList.contains('on') || fxa.classList.contains('on');
    fxCv.classList.remove('on'); fxa.classList.remove('on');   // la cam normale réapparaît
    if (shown) await new Promise(r => setTimeout(r, Math.max(C.OVERLAY_FADE, .25) * 1000 + 80));
    fxCleanup();
    if (fxQ.length) setTimeout(fxNext, failed ? 1500 : 300);
    else vcamOff();                                  // (VCAM_AUTO) plus rien en attente → caméra virtuelle éteinte
  };
  const fxCleanup = () => {
    fx.on = false; fx.ending = false; fx.t0 = 0; fx.drawn = null; fx.parts = []; fx.guy = null; fx.mask = false;
    fx.pup = null; fx.body = null; fx.refBody = null; fx.lastPresent = 0; fx.ori = null; fx.refHead = null;
    if (actx) actx.clearRect(0, 0, fxa.width, fxa.height);
    cancelAnimationFrame(fx.raf);
    try { vid.cancelVideoFrameCallback(fx.rvfc); } catch (_) {}
    vid.srcObject = null;
    if (fx.track) fx.track.stop();                   // caméra fermée : plus rien ne calcule
    fx.track = null;
  };
  const fxNext = () => { if (!fx.on && fxQ.length) fxStart(fxQ.shift()); };

  /* garde-fou : plus d'image depuis 1 s → le calque s'efface (jamais d'image figée à l'antenne) */
  setInterval(() => {
    if (fx.on && fx.t0 && !fx.ending && performance.now() - fx.lastFrame > 1000) {
      ST.err = 'plus d\'image de la caméra virtuelle → calque retiré'; fxEnd(true);
    }
  }, 250);

  const FX_ALIAS = { kawai:'chat', kawaii:'chat', mad:'fache', colere:'fache', idee:'pleure', yeux:'mini', bouche:'derriere', zinzin:'benet', derriere2:'derriere', farceur:'derriere', stand:'derriere', jojo:'derriere' };   // mêmes noms que la cam tel
  const fxRequest = d => {
    const m = (d && d.meta && typeof d.meta === 'object') ? d.meta : {};
    let key = String(m.nom || (d && d.nom) || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[\s_\-]+/g, '').trim();
    key = FX_ALIAS[key] || key;
    if (!FX[key]) { log('filtre inconnu :', key); ST.err = 'filtre inconnu : « ' + key + ' »'; return; }
    if (fx.on) { if (fxQ.length < C.FILTER_QUEUE_MAX) fxQ.push(key); return; }
    fxStart(key);
  };

  /* ---------- Déclencheur : Social Stream Ninja, canal 1 (comme la cam tel) ---------- */
  const handle = d => {
    if (!d || typeof d !== 'object') return;
    if (d.content) d = d.content;
    if (String(d.event || '').toLowerCase() === 'filtre_bureau' && C.FILTERS) fxRequest(d);
  };
  if (SESSION) {
    let ws = null, retry = null;
    const connect = () => {
      clearTimeout(retry);
      try {
        ws = new WebSocket('wss://io.socialstream.ninja/join/' + encodeURIComponent(SESSION) + '/1');
        ws.onopen  = () => { ST.ws = true; };
        ws.onmessage = ev => {
          let d;
          try { d = JSON.parse(ev.data); } catch (_) { return; }
          if (d && d.action && d.value !== undefined) d = d.value;
          if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) {} }
          if (d && d.overlayNinja) d = d.overlayNinja;
          if (d && typeof d === 'object' && (d.event || d.content)) handle(d);
        };
        ws.onclose = () => { ST.ws = false; retry = setTimeout(connect, 3000); };
        ws.onerror = () => { try { ws.close(); } catch (_) {} };
      } catch (_) { retry = setTimeout(connect, 3000); }
    };
    connect();
  }

  /* ---------- Panneau de mesures (&stats) ---------- */
  const f1 = x => x.toFixed(1).replace('.', ',');
  const hudPaint = () => {
    const s = fx.track && fx.track.readyState === 'live' ? fx.track.getSettings() : null;
    const el = fx.t0 ? Math.floor((performance.now() - fx.t0) / 1000) : 0;
    hud.textContent = [
      'CAM BUREAU · 9 filtres',
      'Moteur : ' + ({ ok:'prêt ✅ ' + (lmGpu ? 'GPU' : 'CPU ⚠️'), load:'préparation…', err:'erreur ⚠️', off:'en attente' }[lmState])
                  + (seg ? ' · détourage prêt' : ''),
      'SSN    : ' + (!SESSION ? 'pas de #chat= ⚠️' : ST.ws ? 'connecté ✅' : 'connexion…'),
      'Cam virtuelle : ' + (ST.vcam == null ? 'état inconnu' : ST.vcam ? 'allumée' : 'éteinte')
                  + (!C.VCAM_AUTO ? ' (gérée par SAMMI)' : vcamCan() ? ' (auto ✅)' : ' (auto impossible : « Accès complet à OBS » ?) ⚠️'),
      'Caméra : ' + (s ? (ST.cam || '?') + ' · ' + (vid.videoWidth || s.width) + '×' + (vid.videoHeight || s.height) + ' · ' + Math.round(s.frameRate || 0) + ' i/s' : 'fermée (repos)'),
      'Calque : ' + (fx.on ? ST.fps + ' i/s · calcul ' + fxCv.width + '×' + fxCv.height + ' · suivi ' + ST.dps + '/s · ' + f1(ST.avg) + ' ms (max ' + f1(ST.max) + ') · visage '
                             + (fx.face > .5 ? 'vu' : 'perdu') + (fx.useRaf ? ' · mode secours' : '') : '—'),
      'État   : ' + (fx.on ? FX[fx.key].name + (fx.t0 ? ' · ' + el + ' / ' + C.FILTER_DURATION + ' s' : ' · démarrage…') : 'repos')
                  + (fxQ.length ? ' · file ' + fxQ.length : ''),
      fx.on && FX[fx.key].keep ? 'Paatrice : ' + ({ ok:'à côté de toi', profil:'dans ton dos (visage perdu)', absent:'marionnette (tu n\'es pas à l\'image)' }[fx.pstate] || '…')
                  + (fx.body ? ' · silhouette ' + Math.round((fx.body.cov || 0) * 100) + ' %' : '')
                  + (fx.guy && fx.guy.st >= 0 ? ' · STAND' : '') + (C.PAAT_CALQUE ? ' · calque transparent' : ' · ancienne méthode')
                  + '\nRegard   : ' + (!C.PAAT_CORPS ? 'suivi du corps coupé' : !bodyLm ? 'suivi du corps pas prêt ⚠️'
                     : fx.ori ? 'tête ' + (fx.ori.head == null ? '?' : Math.round(fx.ori.head) + '°') + ' · corps ' + (fx.ori.body == null ? '?' : Math.round(fx.ori.body) + '°')
                       + ' → ' + (fx.guy && fx.guy.gaze ? (fx.guy.gaze > 0 ? 'tu regardes à droite' : 'tu regardes à gauche') : 'de face') : 'personne') : '',
      ST.err ? 'Erreur : ' + ST.err : '',
      RAW ? 'BRUT   : vidéo ' + vid.videoWidth + '×' + vid.videoHeight + ' · capacités ' + (ST.caps || '?')
            + '\nAppareils : ' + (ST.devs || '?') : ''
    ].filter(Boolean).join('\n');
  };
  setInterval(() => {
    ST.fps = ST.frames; ST.dps = ST.dets; ST.avg = ST.dets ? ST.detMs / ST.dets : 0; ST.max = ST.detMax;
    ST.frames = 0; ST.dets = 0; ST.detMs = 0; ST.detMax = 0;
    if (hud.classList.contains('on')) { vcamStatus().then(v => { ST.vcam = v; }); hudPaint(); }
  }, 1000);
  if (has('stats')) { hud.classList.add('on'); hudPaint(); }

  /* ---------- Lancement ---------- */
  if (C.FILTERS && C.FILTER_PRELOAD) setTimeout(() => ensureLM().catch(() => {}), 1500);
  if (C.FILTERS && C.FILTER_PRELOAD && !window.__TEST) setTimeout(() => { try { beauSprite(); } catch (_) {} }, 3500);   // tête de Paatrice beau gosse prête d'avance
  try { document.fonts.load('40px "Mouse Memoirs"'); } catch (_) {}   // police des bulles et du Stand
  if (has('test')) setTimeout(() => fxRequest({ meta:{ nom:get('test') || 'benet' } }), 5000);
})();
</script>
